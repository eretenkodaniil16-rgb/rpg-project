name: Validate spell reactions Counterspell

on:
  pull_request:
    paths:
      - "data/abilities/abilities.json"
      - "data/classes/classes.json"
      - "scenes/game/game.tscn"
      - "scripts/data/spell_cast_attempt.gd"
      - "scripts/game/game_spell_reactions_runtime.gd"
      - "scripts/game/rune_training_construct.gd"
      - "scripts/systems/spell_reaction_system.gd"
      - "scripts/systems/spellcasting_system.gd"
      - "scripts/ui/spell_reaction_prompt.gd"
      - "tests/test_spell_reactions_counterspell.gd"
      - "tests/smoke_spell_reaction_prompt.gd"
  push:
    branches:
      - feature/spell-reactions-counterspell
    paths:
      - "data/abilities/abilities.json"
      - "data/classes/classes.json"
      - "scenes/game/game.tscn"
      - "scripts/data/spell_cast_attempt.gd"
      - "scripts/game/game_spell_reactions_runtime.gd"
      - "scripts/game/rune_training_construct.gd"
      - "scripts/systems/spell_reaction_system.gd"
      - "scripts/systems/spellcasting_system.gd"
      - "scripts/ui/spell_reaction_prompt.gd"
      - "tests/test_spell_reactions_counterspell.gd"
      - "tests/smoke_spell_reaction_prompt.gd"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Godot 4.7.1 Standard
        shell: bash
        run: |
          curl --location --fail --retry 3 --output godot.zip "https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.1"
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Import project
        shell: bash
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE" --quit

      - name: Validate previous spellcasting layers
        shell: bash
        run: |
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/test_spellcasting_progression_components.gd
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/test_spell_targeting_areas.gd

      - name: Validate Counterspell reaction rules
        shell: bash
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/test_spell_reactions_counterspell.gd

      - name: Smoke test paused mobile reaction prompt
        shell: bash
        run: |
          set +e
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_spell_reaction_prompt.gd 2>&1 | tee counterspell-runtime-smoke.log
          status=${PIPESTATUS[0]}
          echo "godot_exit_status=${status}" | tee -a counterspell-runtime-smoke.log
          exit "${status}"

      - name: Upload Counterspell smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: counterspell-runtime-smoke
          path: counterspell-runtime-smoke.log
          if-no-files-found: error
          retention-days: 7
