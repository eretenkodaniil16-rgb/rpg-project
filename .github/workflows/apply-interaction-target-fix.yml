name: Apply interaction and target fix

on:
  push:
    branches:
      - feature/squad-tactical-plans
    paths:
      - "tools/apply_interaction_target_fix.py"

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.event.head_commit.message == 'chore: run interaction target patch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: feature/squad-tactical-plans
          fetch-depth: 0

      - name: Apply interaction and target patch
        run: python tools/apply_interaction_target_fix.py

      - name: Commit patched runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: сделать тактические роли целями и разрешить двери в бою"
          git push origin HEAD:feature/squad-tactical-plans
