name: Validate unified encounters

on:
  pull_request:
    paths:
      - "data/encounters/encounters.json"
      - "data/dialogues/caretaker_intro.json"
      - "scripts/systems/encounter_system.gd"
      - "scripts/core/game_state_encounters.gd"
      - "scripts/core/game_state_rewards.gd"
      - "scripts/game/game_encounters_runtime.gd"
      - "scripts/game/training_dummy.gd"
      - "scripts/ui/dialogue_ui_base.gd"
      - "project.godot"
      - "scenes/game/game.tscn"
      - "tests/test_encounter_system.gd"
      - "tests/smoke_encounter_runtime.gd"
      - ".github/workflows/validate-encounters.yml"
  push:
    branches:
      - feature/unified-encounter-system
    paths:
      - "data/encounters/encounters.json"
      - "data/dialogues/caretaker_intro.json"
      - "scripts/systems/encounter_system.gd"
      - "scripts/core/game_state_encounters.gd"
      - "scripts/core/game_state_rewards.gd"
      - "scripts/game/game_encounters_runtime.gd"
      - "scripts/game/training_dummy.gd"
      - "scripts/ui/dialogue_ui_base.gd"
      - "project.godot"
      - "scenes/game/game.tscn"
      - "tests/test_encounter_system.gd"
      - "tests/smoke_encounter_runtime.gd"
      - ".github/workflows/validate-encounters.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Godot 4.7.1 Standard
        shell: bash
        run: |
          curl --location --fail --retry 3 --output godot.zip "https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.1"
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Import project
        shell: bash
        run: |
          rm -rf .godot
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE" --quit

      - name: Validate encounter lifecycle, consequences and migration
        shell: bash
        run: timeout 120s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/test_encounter_system.gd

      - name: Smoke test combat and dialogue encounter runtime
        shell: bash
        run: timeout 120s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_encounter_runtime.gd
