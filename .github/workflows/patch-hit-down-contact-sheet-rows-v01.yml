name: Patch hit down contact sheet rows v01

on:
  push:
    branches:
      - tools/human-warrior-hit-down-keyposes-v01
    paths:
      - ".github/workflows/patch-hit-down-contact-sheet-rows-v01.yml"
      - "tools/blender_sprite_factory/patch_hit_down_contact_sheet_rows_v01.py"

permissions:
  contents: write

concurrency:
  group: patch-hit-down-contact-sheet-rows-v01-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Checkout art branch
        uses: actions/checkout@v4
        with:
          ref: tools/human-warrior-hit-down-keyposes-v01

      - name: Apply row-order patch
        run: python tools/blender_sprite_factory/patch_hit_down_contact_sheet_rows_v01.py

      - name: Commit adapter fix
        shell: bash
        run: |
          set -euo pipefail
          git add tools/blender_sprite_factory/blender_sprite_factory_hit_down_keyposes_v01.py
          if git diff --cached --quiet; then
            echo "Contact-sheet row patch is already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: синхронизировать порядок строк hit_down contact sheet"
          git push origin HEAD:tools/human-warrior-hit-down-keyposes-v01
