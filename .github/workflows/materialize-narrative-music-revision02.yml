name: Materialize narrative music revision 02

on:
  push:
    branches:
      - feature/narrative-music-pack-v01
    paths:
      - "tools/audio/generate_narrative_music_pack_v02.py"
      - "assets/audio/music/source/elevator_descent_floor01_v01_score.json"
      - "assets/audio/music/source/act01_plan_broken_v01_score.json"
      - ".github/workflows/materialize-narrative-music-revision02.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/narrative-music-pack-v01

      - name: Install pinned audio toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          python -m pip install --disable-pip-version-check --upgrade "numpy==2.3.5"

      - name: Render revision 02 masters
        run: |
          set -euo pipefail
          python -m py_compile tools/audio/generate_narrative_music_pack_v02.py
          for cid in elevator_descent_floor01_v01 act01_plan_broken_v01
          do
            out="build/audio/narrative_revision02/${cid}"
            python tools/audio/generate_narrative_music_pack_v02.py \
              --score "assets/audio/music/source/${cid}_score.json" \
              --output "$out"
            cp "$out/${cid}_master.ogg" "assets/audio/music/exports/${cid}_master.ogg"
            cp "$out/${cid}_master_manifest.json" "assets/audio/music/source/${cid}_master_manifest.json"
          done

      - name: Commit exact Linux masters
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            assets/audio/music/exports/elevator_descent_floor01_v01_master.ogg \
            assets/audio/music/exports/act01_plan_broken_v01_master.ogg \
            assets/audio/music/source/elevator_descent_floor01_v01_master_manifest.json \
            assets/audio/music/source/act01_plan_broken_v01_master_manifest.json
          if git diff --cached --quiet; then
            echo "No materialized changes."
            exit 0
          fi
          git commit -m "chore(audio): materialize narrative revision 02 masters"
          git push origin HEAD:feature/narrative-music-pack-v01
