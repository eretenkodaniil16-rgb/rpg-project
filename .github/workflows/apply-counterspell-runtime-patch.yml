name: Apply Counterspell runtime patch

on:
  push:
    branches:
      - feature/spell-reactions-counterspell
    paths:
      - ".github/patch_triggers/counterspell_runtime_patch.txt"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/spell-reactions-counterspell
          fetch-depth: 0

      - name: Apply deterministic patch
        run: python tools/maintenance/apply_counterspell_runtime_patch.py

      - name: Commit patched runtime
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/game/game_srd_combat.gd .github/workflows/validate-spell-reactions-counterspell.yml
          git commit -m "feat: wire Counterspell prompt into enemy spell turns"
          git push origin HEAD:feature/spell-reactions-counterspell
