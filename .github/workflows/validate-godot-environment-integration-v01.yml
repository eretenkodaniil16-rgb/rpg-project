name: Validate Godot environment integration v01

on:
  pull_request:
    paths:
      - "assets/environment/approved/cold_ancient_stone_v01/**"
      - "data/environment/**"
      - "scenes/game/environment/**"
      - "scenes/game/game.tscn"
      - "scripts/game/environment/**"
      - "scripts/game/guard_post_environment_integration.gd"
      - "tests/smoke_godot_environment_integration_v01.gd"
      - "tests/smoke_movement_wall_integrity.gd"
      - "tests/smoke_player_visibility_save_runtime.gd"
      - "tests/smoke_guard_post_presentation_and_parley.gd"
      - "tools/environment_integration/**"
      - "docs/GODOT_ENVIRONMENT_INTEGRATION_V01.md"
      - ".github/workflows/validate-godot-environment-integration-v01.yml"
  push:
    branches:
      - feature/godot-environment-integration-v01

concurrency:
  group: godot-environment-v01-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate approved assets and layout contracts
        run: python3 tools/environment_integration/validate_environment_integration_v01.py

      - name: Download Godot 4.7.1 Standard
        shell: bash
        run: |
          curl --location --fail --retry 3 \
            --output godot.zip \
            "https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Import project and reject parser errors
        shell: bash
        run: |
          rm -rf .godot
          set -o pipefail
          timeout 180s ./Godot_v4.7.1-stable_linux.x86_64 \
            --headless --editor --path "$GITHUB_WORKSPACE" --quit \
            2>&1 | tee environment-v01-import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" environment-v01-import.log; then
            exit 1
          fi

      - name: Smoke test approved environment runtime
        shell: bash
        run: |
          timeout 180s ./Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path "$GITHUB_WORKSPACE" \
            --script res://tests/smoke_godot_environment_integration_v01.gd \
            2>&1 | tee environment-v01-smoke.log
          grep -F "Godot Environment Integration v01: assets, layers, fallback, doors, reload and demo passed." environment-v01-smoke.log

      - name: Regression test wall mechanics
        shell: bash
        run: |
          timeout 180s ./Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path "$GITHUB_WORKSPACE" \
            --script res://tests/smoke_movement_wall_integrity.gd \
            2>&1 | tee environment-v01-walls.log

      - name: Regression test visibility and save runtime
        shell: bash
        run: |
          timeout 360s ./Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path "$GITHUB_WORKSPACE" \
            --script res://tests/smoke_player_visibility_save_runtime.gd \
            2>&1 | tee environment-v01-visibility-save.log

      - name: Regression test guard-post presentation and parley
        shell: bash
        run: |
          timeout 360s ./Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path "$GITHUB_WORKSPACE" \
            --script res://tests/smoke_guard_post_presentation_and_parley.gd \
            2>&1 | tee environment-v01-guard-post.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-environment-integration-v01-diagnostics
          path: |
            environment-v01-import.log
            environment-v01-smoke.log
            environment-v01-walls.log
            environment-v01-visibility-save.log
            environment-v01-guard-post.log
          if-no-files-found: ignore
          retention-days: 7
