name: Apply human warrior runtime v02

on:
  push:
    branches:
      - feature/human-warrior-runtime-animation-v02
    paths:
      - ".github/workflows/apply-human-warrior-runtime-v02.yml"
      - "tools/runtime_animation/apply_human_warrior_runtime_v02.py"

permissions:
  contents: write

concurrency:
  group: apply-human-warrior-runtime-v02-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Checkout runtime branch
        uses: actions/checkout@v4
        with:
          ref: feature/human-warrior-runtime-animation-v02

      - name: Apply focused runtime patch
        run: python tools/runtime_animation/apply_human_warrior_runtime_v02.py

      - name: Commit patched combat resolvers
        shell: bash
        run: |
          set -euo pipefail
          git add \
            scripts/game/game_srd_combat.gd \
            scripts/game/game_consumable_inventory_base_runtime.gd
          if git diff --cached --quiet; then
            echo "Runtime patch is already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: синхронизировать melee урон с contact-кадром"
          git push origin HEAD:feature/human-warrior-runtime-animation-v02
