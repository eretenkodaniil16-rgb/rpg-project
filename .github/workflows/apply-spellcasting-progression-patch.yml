name: Apply spellcasting progression patch

on:
  push:
    branches:
      - feature/spellcasting-progression-components
    paths:
      - ".github/patch_triggers/spellcasting_progression_patch.txt"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/spellcasting-progression-components
          fetch-depth: 0

      - name: Apply deterministic patch
        run: python tools/maintenance/apply_spellcasting_progression_patch.py

      - name: Commit patched files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/systems/spellcasting_system.gd scripts/systems/class_ability_system.gd data/abilities/abilities.json
          git commit -m "feat: integrate spell progression upcasting and components"
          git push origin HEAD:feature/spellcasting-progression-components
