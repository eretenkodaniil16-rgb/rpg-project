name: Validate exploration stealth alerts

on:
  pull_request:
    paths:
      - "data/world/stealth_alerts.json"
      - "scripts/systems/stealth_alert_system.gd"
      - "scripts/core/game_state_stealth_alerts.gd"
      - "scripts/game/npc_stealth.gd"
      - "scripts/game/stealth_door.gd"
      - "scripts/game/stealth_test_room.gd"
      - "scripts/game/game_exploration_stealth_runtime.gd"
      - "scripts/game/game_pursuit_escape_runtime.gd"
      - "scenes/game/game_base.tscn"
      - "scenes/game/game.tscn"
      - "project.godot"
      - "tests/test_stealth_alert_system.gd"
      - "tests/smoke_exploration_stealth_alerts.gd"
      - ".github/workflows/validate-stealth-alerts.yml"
  push:
    branches:
      - feature/exploration-stealth-alerts

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Godot 4.7.1 Standard
        shell: bash
        run: |
          curl --location --fail --retry 3 --output godot.zip "https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.1"
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Import project
        shell: bash
        run: |
          rm -rf .godot
          timeout 120s ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE" --quit 2>&1 | tee stealth-alert-import.log

      - name: Validate stealth, vision, doors and noise
        shell: bash
        run: timeout 120s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/test_stealth_alert_system.gd 2>&1 | tee stealth-alert-unit.log

      - name: Smoke test exploration alert runtime
        shell: bash
        run: timeout 120s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_exploration_stealth_alerts.gd 2>&1 | tee stealth-alert-smoke.log

      - name: Upload stealth alert diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stealth-alert-diagnostics
          path: |
            stealth-alert-import.log
            stealth-alert-unit.log
            stealth-alert-smoke.log
          retention-days: 3
