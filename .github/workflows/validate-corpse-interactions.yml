name: Validate corpse interactions

on:
  pull_request:
    paths:
      - "data/world/corpse_loot_profiles.json"
      - "scripts/systems/corpse_interaction_system.gd"
      - "scripts/game/npc.gd"
      - "scripts/game/npc_body_runtime.gd"
      - "scripts/game/npc_stealth.gd"
      - "scripts/game/npc_stealth_context_dialogue.gd"
      - "scripts/game/player_combat.gd"
      - "scripts/game/game_movement_reactions_runtime.gd"
      - "scripts/game/game_corpse_interactions_runtime.gd"
      - "scenes/game/game.tscn"
      - "tests/test_corpse_interaction_system.gd"
      - "tests/smoke_corpse_interactions_runtime.gd"
      - "tests/smoke_combat_lifecycle_reactions.gd"
      - ".github/workflows/validate-corpse-interactions.yml"
  push:
    branches:
      - feature/corpse-interactions
      - fix/world-state-npc-navigation

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Godot 4.7.1 Standard
        shell: bash
        run: |
          curl --location --fail --retry 3 --output godot.zip "https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.1"
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Import project and reject parser errors
        shell: bash
        run: |
          rm -rf .godot
          set -o pipefail
          timeout 120s ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE" --quit 2>&1 | tee corpse-import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" corpse-import.log; then
            exit 1
          fi

      - name: Validate corpse registry and loot transactions
        shell: bash
        run: timeout 150s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/test_corpse_interaction_system.gd 2>&1 | tee corpse-unit.log

      - name: Smoke test corpse actions and dragging
        shell: bash
        run: timeout 180s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_corpse_interactions_runtime.gd 2>&1 | tee corpse-smoke.log

      - name: Validate corpse lifecycle inside integrated combat
        shell: bash
        run: timeout 360s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_combat_lifecycle_reactions.gd 2>&1 | tee combat-lifecycle-reactions.log

      - name: Regression test tactical Combat AI
        shell: bash
        run: timeout 150s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_combat_ai_tactical_runtime.gd 2>&1 | tee combat-ai-regression.log

      - name: Regression test inventory and character hub
        shell: bash
        run: timeout 150s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_quest_inventory_ui.gd 2>&1 | tee inventory-regression.log

      - name: Regression test integrated v0.18 contract
        shell: bash
        run: timeout 150s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/test_v018_integration_stack.gd 2>&1 | tee v018-regression.log

      - name: Upload corpse diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpse-interactions-diagnostics
          path: |
            corpse-import.log
            corpse-unit.log
            corpse-smoke.log
            combat-lifecycle-reactions.log
            combat-ai-regression.log
            inventory-regression.log
            v018-regression.log
          retention-days: 5