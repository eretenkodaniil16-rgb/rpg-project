name: Bootstrap human warrior runtime animation

on:
  workflow_dispatch:
  push:
    branches:
      - feature/human-warrior-runtime-animation-test
    paths:
      - "tools/runtime_animation/bootstrap_runtime_v01.tar.gz.b64"
      - ".github/workflows/bootstrap-human-warrior-runtime-animation.yml"

permissions:
  actions: read
  contents: write

concurrency:
  group: bootstrap-human-warrior-runtime-animation
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      V14_ARTIFACT_ID: "8773156705"
      V16_ARTIFACT_ID: "8820190573"
      OUTPUT_DIR: assets/characters/human/warrior_m01/gameplay/approved/atlases
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: feature/human-warrior-runtime-animation-test

      - name: Restore reviewed integration sources
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode tools/runtime_animation/bootstrap_runtime_v01.tar.gz.b64 | tar -xzf -

      - name: Download approved Blender artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v14" "$RUNNER_TEMP/v16"
          curl -L --fail --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o "$RUNNER_TEMP/v14.zip" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$V14_ARTIFACT_ID/zip"
          curl -L --fail --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o "$RUNNER_TEMP/v16.zip" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$V16_ARTIFACT_ID/zip"
          unzip -q "$RUNNER_TEMP/v14.zip" -d "$RUNNER_TEMP/v14"
          unzip -q "$RUNNER_TEMP/v16.zip" -d "$RUNNER_TEMP/v16"

      - name: Build deterministic 96x96 runtime atlases
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "Pillow>=11.1.0,<13.0.0"
          python tools/runtime_animation/materialize_human_warrior_runtime_v01.py \
            --v14-root "$RUNNER_TEMP/v14" \
            --v16-root "$RUNNER_TEMP/v16" \
            --output "$OUTPUT_DIR"

      - name: Commit runtime integration
        shell: bash
        run: |
          set -euo pipefail
          git add \
            "$OUTPUT_DIR" \
            data/visuals/human_warrior_m01_runtime_v01.json \
            docs/HUMAN_WARRIOR_RUNTIME_ANIMATION_TEST.md \
            scripts/game/human_warrior_animation_library.gd \
            scripts/game/player.gd \
            scripts/game/player_combat.gd \
            scripts/ui/human_warrior_animation_test_panel.gd \
            tests/test_human_warrior_runtime_animation.gd \
            tools/runtime_animation/materialize_human_warrior_runtime_v01.py
          if git diff --cached --quiet; then
            echo "Runtime integration is already materialized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: integrate approved human warrior runtime animations"
          git push origin HEAD:feature/human-warrior-runtime-animation-test
