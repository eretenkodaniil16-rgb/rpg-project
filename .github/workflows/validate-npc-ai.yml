name: Validate NPC context actions and AI

on:
  pull_request:
    paths:
      - "data/ai/npc_ai_profiles.json"
      - "data/world/patrol_alert_groups.json"
      - "scenes/game/stealth_patrol_guard.tscn"
      - "scripts/systems/npc_ai_system.gd"
      - "scripts/systems/npc_navigation_system.gd"
      - "scripts/systems/turn_based_combat_system_ai.gd"
      - "scripts/systems/patrol_alert_group_system_ai.gd"
      - "scripts/game/game_pursuit_escape_runtime.gd"
      - "scripts/game/npc_stealth.gd"
      - "scripts/game/stealth_patrol_observer.gd"
      - "scripts/game/stealth_test_room.gd"
      - "scripts/game/stealth_door.gd"
      - "scripts/ui/action_catalog_ui.gd"
      - "tests/test_npc_ai_system.gd"
      - "tests/smoke_npc_context_actions_ai.gd"
      - ".github/workflows/validate-npc-ai.yml"
  push:
    branches:
      - feature/npc-context-actions-ai-foundation

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Godot 4.7.1 Standard
        shell: bash
        run: |
          curl --location --fail --retry 3 --output godot.zip "https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.1"
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Import project
        shell: bash
        run: |
          rm -rf .godot
          timeout 120s ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE" --quit 2>&1 | tee npc-ai-import.log

      - name: Validate NPC AI and initiative joins
        shell: bash
        run: timeout 120s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/test_npc_ai_system.gd 2>&1 | tee npc-ai-unit.log

      - name: Smoke test context actions, navigation and reinforcements
        shell: bash
        run: timeout 150s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_npc_context_actions_ai.gd 2>&1 | tee npc-ai-smoke.log

      - name: Regression test patrol and alerts
        shell: bash
        run: timeout 120s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_patrol_alert_groups.gd 2>&1 | tee patrol-regression.log

      - name: Regression test exploration stealth
        shell: bash
        run: timeout 120s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_exploration_stealth_alerts.gd 2>&1 | tee stealth-regression.log

      - name: Regression test combat pursuit escape
        shell: bash
        run: timeout 120s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_hidden_combat_escape.gd 2>&1 | tee pursuit-regression.log

      - name: Upload NPC AI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npc-ai-diagnostics
          path: |
            npc-ai-import.log
            npc-ai-unit.log
            npc-ai-smoke.log
            patrol-regression.log
            stealth-regression.log
            pursuit-regression.log
          retention-days: 3
