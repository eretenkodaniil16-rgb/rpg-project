name: Diagnose game script

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Godot 4.7.1 Standard
        shell: bash
        run: |
          curl --location --fail --retry 3 --output godot.zip "https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.1"
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Import project
        shell: bash
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE" --quit

      - name: Check game script load
        id: game_script
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p build/game-script-diagnostics
          set +e
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/check_game_script_load.gd 2>&1 | tee build/game-script-diagnostics/game-script.log
          status=${PIPESTATUS[0]}
          echo "$status" > build/game-script-diagnostics/game-script-status.txt
          exit "$status"

      - name: Instantiate game scene
        id: game_scene
        continue-on-error: true
        shell: bash
        run: |
          set +e
          timeout 45s ./Godot_v4.7.1-stable_linux.x86_64 --headless --verbose --path "$GITHUB_WORKSPACE" --script res://tests/smoke_training_dummy.gd 2>&1 | tee build/game-script-diagnostics/game-scene.log
          status=${PIPESTATUS[0]}
          echo "$status" > build/game-script-diagnostics/game-scene-status.txt
          cp build/test/training-dummy-status.txt build/game-script-diagnostics/training-dummy-status.txt 2>/dev/null || true
          exit "$status"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-script-diagnostics
          path: build/game-script-diagnostics/
          if-no-files-found: error
          retention-days: 7

      - name: Fail when diagnostics failed
        if: steps.game_script.outcome != 'success' || steps.game_scene.outcome != 'success'
        shell: bash
        run: exit 1
