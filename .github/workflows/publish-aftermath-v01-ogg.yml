name: Publish aftermath v01 Ogg

on:
  push:
    branches:
      - feature/aftermath-v01
    paths:
      - ".github/workflows/publish-aftermath-v01-ogg.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-aftermath-v01-ogg
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/aftermath-v01
          fetch-depth: 0

      - name: Download verified bootstrap artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --location --fail --retry 4 --retry-all-errors \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output /tmp/aftermath-v01.zip \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/8952238163/zip"
          mkdir -p /tmp/aftermath-v01
          unzip -q /tmp/aftermath-v01.zip -d /tmp/aftermath-v01
          test "$(sha256sum /tmp/aftermath-v01/aftermath_v01_master.ogg | cut -d' ' -f1)" = "1a1cc9cfdb84fd1f571bbfc381e516568624e4800b6963e02bf76e623ce697b8"

      - name: Commit exact game master
        env:
          HEAD_BRANCH: feature/aftermath-v01
        run: |
          mkdir -p assets/audio/music/exports
          cp /tmp/aftermath-v01/aftermath_v01_master.ogg assets/audio/music/exports/aftermath_v01_master.ogg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f assets/audio/music/exports/aftermath_v01_master.ogg
          git commit -m "fix(audio): добавить точный aftermath game master"
          git push origin "HEAD:${HEAD_BRANCH}"
