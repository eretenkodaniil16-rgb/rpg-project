name: Validate reaction opportunities and Vicious Mockery

on:
  pull_request:
    paths:
      - "scenes/game/game.tscn"
      - "scripts/game/game_reaction_opportunities_runtime.gd"
      - "scripts/systems/reaction_opportunity_system.gd"
      - "scripts/systems/vicious_mockery_system.gd"
      - "scripts/ui/reaction_choice_prompt.gd"
      - "tests/test_vicious_mockery_reaction_opportunities.gd"
      - "tests/smoke_reaction_list_vicious_mockery.gd"
      - "tests/smoke_spell_reaction_prompt.gd"
  push:
    branches:
      - feature/reaction-opportunities-vicious-mockery
    paths:
      - "scenes/game/game.tscn"
      - "scripts/game/game_reaction_opportunities_runtime.gd"
      - "scripts/systems/reaction_opportunity_system.gd"
      - "scripts/systems/vicious_mockery_system.gd"
      - "scripts/ui/reaction_choice_prompt.gd"
      - "tests/test_vicious_mockery_reaction_opportunities.gd"
      - "tests/smoke_reaction_list_vicious_mockery.gd"
      - "tests/smoke_spell_reaction_prompt.gd"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Godot 4.7.1 Standard
        shell: bash
        run: |
          curl --location --fail --retry 3 --output godot.zip "https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.1"
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Import project
        shell: bash
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE" --quit

      - name: Validate Vicious Mockery and reaction option rules
        shell: bash
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/test_vicious_mockery_reaction_opportunities.gd

      - name: Validate migrated Counterspell reaction list
        shell: bash
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_spell_reaction_prompt.gd

      - name: Smoke test multi-option reaction list and Vicious Mockery runtime
        shell: bash
        run: |
          set +e
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_reaction_list_vicious_mockery.gd 2>&1 | tee reaction-vicious-runtime.log
          status=${PIPESTATUS[0]}
          echo "godot_exit_status=${status}" | tee -a reaction-vicious-runtime.log
          exit "${status}"

      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reaction-vicious-runtime
          path: reaction-vicious-runtime.log
          if-no-files-found: warn
          retention-days: 7
