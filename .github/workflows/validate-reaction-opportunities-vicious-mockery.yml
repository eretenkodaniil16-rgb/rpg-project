name: Validate reaction opportunities and Vicious Mockery

on:
  pull_request:
    paths:
      - "scenes/game/game.tscn"
      - "scripts/game/game_reaction_opportunities_runtime.gd"
      - "scripts/game/game_all_reaction_prompts_runtime.gd"
      - "scripts/game/game_movement_reactions_runtime.gd"
      - "scripts/game/game_corpse_interactions_runtime.gd"
      - "scripts/systems/reaction_opportunity_system.gd"
      - "scripts/systems/vicious_mockery_system.gd"
      - "scripts/ui/reaction_choice_prompt.gd"
      - "tests/test_vicious_mockery_reaction_opportunities.gd"
      - "tests/smoke_reaction_list_vicious_mockery.gd"
      - "tests/smoke_readied_reaction_prompt.gd"
      - "tests/smoke_spell_reaction_prompt.gd"
      - "tests/smoke_combat_lifecycle_reactions.gd"
      - ".github/workflows/validate-reaction-opportunities-vicious-mockery.yml"
  push:
    branches:
      - feature/reaction-opportunities-vicious-mockery
      - fix/world-state-npc-navigation
    paths:
      - "scenes/game/game.tscn"
      - "scripts/game/game_reaction_opportunities_runtime.gd"
      - "scripts/game/game_all_reaction_prompts_runtime.gd"
      - "scripts/game/game_movement_reactions_runtime.gd"
      - "scripts/game/game_corpse_interactions_runtime.gd"
      - "scripts/systems/reaction_opportunity_system.gd"
      - "scripts/systems/vicious_mockery_system.gd"
      - "scripts/ui/reaction_choice_prompt.gd"
      - "tests/test_vicious_mockery_reaction_opportunities.gd"
      - "tests/smoke_reaction_list_vicious_mockery.gd"
      - "tests/smoke_readied_reaction_prompt.gd"
      - "tests/smoke_spell_reaction_prompt.gd"
      - "tests/smoke_combat_lifecycle_reactions.gd"
      - ".github/workflows/validate-reaction-opportunities-vicious-mockery.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Godot 4.7.1 Standard
        shell: bash
        run: |
          curl --location --fail --retry 3 --output godot.zip "https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.1"
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Import project and reject parser errors
        shell: bash
        run: |
          rm -rf .godot
          set -o pipefail
          timeout 150s ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE" --quit 2>&1 | tee reaction-import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" reaction-import.log; then
            exit 1
          fi

      - name: Validate Vicious Mockery and reaction option rules
        shell: bash
        run: timeout 180s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/test_vicious_mockery_reaction_opportunities.gd

      - name: Validate migrated Counterspell reaction list
        shell: bash
        run: timeout 180s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_spell_reaction_prompt.gd

      - name: Validate readied-action reaction prompt
        shell: bash
        run: timeout 180s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_readied_reaction_prompt.gd

      - name: Simulate NPC movement opportunity reaction
        shell: bash
        run: timeout 360s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_combat_lifecycle_reactions.gd 2>&1 | tee movement-opportunity-runtime.log

      - name: Smoke test multi-option reaction list and Vicious Mockery runtime
        shell: bash
        run: |
          set +e
          timeout 240s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_reaction_list_vicious_mockery.gd 2>&1 | tee reaction-vicious-runtime.log
          status=${PIPESTATUS[0]}
          echo "godot_exit_status=${status}" | tee -a reaction-vicious-runtime.log
          exit "${status}"

      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reaction-vicious-runtime
          path: |
            reaction-import.log
            movement-opportunity-runtime.log
            reaction-vicious-runtime.log
          if-no-files-found: warn
          retention-days: 7