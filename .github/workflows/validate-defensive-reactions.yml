name: Validate defensive reactions

on:
  pull_request:
    paths:
      - "data/abilities/abilities.json"
      - "data/classes/classes.json"
      - "data/rules/spell_selection.json"
      - "scenes/game/game.tscn"
      - "scripts/game/game_defensive_reactions_runtime.gd"
      - "scripts/game/game_defensive_reactions_complete_runtime.gd"
      - "scripts/systems/defensive_reaction_system.gd"
      - "scripts/systems/origin_feat_system.gd"
      - "scripts/systems/reaction_opportunity_system.gd"
      - "scripts/systems/spell_selection_system.gd"
      - "scripts/systems/spellcasting_system.gd"
      - "tests/test_defensive_reactions_shield_absorb_elements.gd"
      - "tests/smoke_defensive_reactions_runtime.gd"
      - "tests/smoke_spell_reaction_prompt.gd"
      - "tests/smoke_reaction_list_vicious_mockery.gd"
      - ".github/workflows/validate-defensive-reactions.yml"
  push:
    branches:
      - feature/defensive-reactions-shield-absorb-elements
      - feature/spell-selection-sources
    paths:
      - "data/abilities/abilities.json"
      - "data/classes/classes.json"
      - "data/rules/spell_selection.json"
      - "scenes/game/game.tscn"
      - "scripts/game/game_defensive_reactions_runtime.gd"
      - "scripts/game/game_defensive_reactions_complete_runtime.gd"
      - "scripts/systems/defensive_reaction_system.gd"
      - "scripts/systems/origin_feat_system.gd"
      - "scripts/systems/reaction_opportunity_system.gd"
      - "scripts/systems/spell_selection_system.gd"
      - "scripts/systems/spellcasting_system.gd"
      - "tests/test_defensive_reactions_shield_absorb_elements.gd"
      - "tests/smoke_defensive_reactions_runtime.gd"
      - "tests/smoke_spell_reaction_prompt.gd"
      - "tests/smoke_reaction_list_vicious_mockery.gd"
      - ".github/workflows/validate-defensive-reactions.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Godot 4.7.1 Standard
        shell: bash
        run: |
          curl --location --fail --retry 3 --output godot.zip "https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.1"
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Import project and reject parser errors
        shell: bash
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE" --quit

      - name: Run defensive reaction validation suite
        shell: bash
        run: |
          set +e
          : > defensive-reactions-suite.log
          failed=0
          run_test() {
            label="$1"
            script="$2"
            echo "===== ${label} =====" | tee -a defensive-reactions-suite.log
            ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script "${script}" 2>&1 | tee -a defensive-reactions-suite.log
            status=${PIPESTATUS[0]}
            echo "exit_status=${status}" | tee -a defensive-reactions-suite.log
            if [ "${status}" -ne 0 ]; then
              failed=1
            fi
          }
          run_test "Shield and Absorb Elements rules" "res://tests/test_defensive_reactions_shield_absorb_elements.gd"
          run_test "Inherited Counterspell reaction list" "res://tests/smoke_spell_reaction_prompt.gd"
          run_test "Inherited universal reactions and Vicious Mockery" "res://tests/smoke_reaction_list_vicious_mockery.gd"
          run_test "Defensive reaction runtime" "res://tests/smoke_defensive_reactions_runtime.gd"
          exit "${failed}"

      - name: Upload defensive reaction diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: defensive-reactions-suite
          path: defensive-reactions-suite.log
          if-no-files-found: warn
          retention-days: 7
