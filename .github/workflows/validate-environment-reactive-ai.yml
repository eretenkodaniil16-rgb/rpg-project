name: Validate environment-reactive AI

on:
  pull_request:
    paths:
      - "data/ai/environment_reactions.json"
      - "scripts/systems/environment_event_system.gd"
      - "scripts/systems/environment_reactive_npc_ai_system.gd"
      - "scripts/game/combat_environment.gd"
      - "scripts/game/game_environment_reactive_ai_runtime.gd"
      - "scenes/game/game.tscn"
      - "tests/test_environment_reactive_ai.gd"
      - "tests/smoke_environment_reactive_ai_runtime.gd"
      - ".github/workflows/validate-environment-reactive-ai.yml"
  push:
    branches:
      - feature/environment-reactive-ai

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Godot 4.7.1 Standard
        shell: bash
        run: |
          curl --location --fail --retry 3 --output godot.zip "https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.1"
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Import project and reject parser errors
        shell: bash
        run: |
          rm -rf .godot
          set -o pipefail
          timeout 120s ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE" --quit 2>&1 | tee environment-import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" environment-import.log; then
            exit 1
          fi

      - name: Validate environment events, role reactions and mutable terrain
        shell: bash
        run: timeout 180s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/test_environment_reactive_ai.gd 2>&1 | tee environment-unit.log

      - name: Smoke test doors, cover destruction and hazards
        shell: bash
        run: timeout 200s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_environment_reactive_ai_runtime.gd 2>&1 | tee environment-smoke.log

      - name: Regression test nonlethal attacks and restraints
        shell: bash
        run: timeout 180s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_corpse_interactions_runtime.gd 2>&1 | tee nonlethal-regression.log

      - name: Regression test advanced tactical AI
        shell: bash
        run: timeout 180s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_advanced_combat_ai_runtime.gd 2>&1 | tee advanced-ai-regression.log

      - name: Regression test exploration stealth
        shell: bash
        run: timeout 180s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_exploration_stealth_alerts.gd 2>&1 | tee stealth-regression.log

      - name: Regression test integrated v0.18 contract
        shell: bash
        run: timeout 180s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/test_v018_integration_stack.gd 2>&1 | tee v018-regression.log

      - name: Upload environment AI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: environment-reactive-ai-diagnostics
          path: |
            environment-import.log
            environment-unit.log
            environment-smoke.log
            nonlethal-regression.log
            advanced-ai-regression.log
            stealth-regression.log
            v018-regression.log
          retention-days: 5
