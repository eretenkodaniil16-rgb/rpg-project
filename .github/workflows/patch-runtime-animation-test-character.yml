name: Patch runtime animation test character

on:
  push:
    branches:
      - feature/human-warrior-runtime-animation-v02
    paths:
      - ".github/workflows/patch-runtime-animation-test-character.yml"
      - "tools/runtime_animation/patch_runtime_animation_test_character.py"

permissions:
  contents: write

concurrency:
  group: patch-runtime-animation-test-character-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Checkout runtime branch
        uses: actions/checkout@v4
        with:
          ref: feature/human-warrior-runtime-animation-v02

      - name: Patch test fixture
        run: python tools/runtime_animation/patch_runtime_animation_test_character.py

      - name: Commit test fixture
        shell: bash
        run: |
          set -euo pipefail
          git add tests/test_human_warrior_runtime_animation_v02.gd
          if git diff --cached --quiet; then
            echo "Fixture patch is already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: использовать runtime player character в animation fixture"
          git push origin HEAD:feature/human-warrior-runtime-animation-v02
