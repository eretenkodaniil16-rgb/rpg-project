name: Validate hidden combat escape

on:
  pull_request:
    paths:
      - "data/encounters/encounters.json"
      - "scripts/systems/combat_escape_system.gd"
      - "scripts/game/escape_zone_overlay.gd"
      - "scripts/game/game_hidden_escape_runtime.gd"
      - "scenes/game/game.tscn"
      - "tests/test_combat_escape_system.gd"
      - "tests/smoke_hidden_combat_escape.gd"
      - "tests/smoke_encounter_runtime.gd"
      - "tests/smoke_fighter_subclass_ui.gd"
      - ".github/workflows/validate-hidden-escape.yml"
  push:
    branches:
      - feature/hidden-combat-escape
    paths:
      - "data/encounters/encounters.json"
      - "scripts/systems/combat_escape_system.gd"
      - "scripts/game/escape_zone_overlay.gd"
      - "scripts/game/game_hidden_escape_runtime.gd"
      - "scenes/game/game.tscn"
      - "tests/test_combat_escape_system.gd"
      - "tests/smoke_hidden_combat_escape.gd"
      - "tests/smoke_encounter_runtime.gd"
      - "tests/smoke_fighter_subclass_ui.gd"
      - ".github/workflows/validate-hidden-escape.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Godot 4.7.1 Standard
        shell: bash
        run: |
          curl --location --fail --retry 3 --output godot.zip "https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.1"
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Import project
        shell: bash
        run: |
          rm -rf .godot
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE" --quit

      - name: Validate escape policy, cells and perception
        shell: bash
        run: timeout 120s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/test_combat_escape_system.gd 2>&1 | tee hidden-escape-unit.log

      - name: Smoke test hide, search, exit and retry
        shell: bash
        run: timeout 120s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_hidden_combat_escape.gd 2>&1 | tee hidden-escape-smoke.log

      - name: Upload hidden escape diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hidden-escape-diagnostics
          path: |
            hidden-escape-unit.log
            hidden-escape-smoke.log
          retention-days: 3
