name: Smoke Blender heart final 1080p

on:
  workflow_dispatch:
  push:
    branches:
      - tools/blender-heart-cycle
    paths:
      - ".github/heart-cycle-final-smoke-request.json"

permissions:
  contents: read

concurrency:
  group: blender-heart-final-v08-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-final-frame:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install headless Blender and probe dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1 libxi6 libxrender1 libxkbcommon-x11-0 \
            fonts-dejavu-core ffmpeg

      - name: Download and verify Blender 5.2.0 LTS
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/blender-5.2.0-linux-x64.tar.xz"
          extract="$RUNNER_TEMP/blender-5.2.0"
          curl -L --fail --retry 3 --output "$archive" \
            "https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz"
          actual="$(sha256sum "$archive" | cut -d' ' -f1)"
          expected="96f6c181a30f4950607839dc84d42a354b250d8a0231b098b59b7bc69c351c48"
          test "$actual" = "$expected"
          mkdir -p "$extract"
          tar -xJf "$archive" -C "$extract"
          blender="$(find "$extract" -type f -name blender -perm -111 | head -n 1)"
          test -n "$blender"
          echo "BLENDER_EXE=$blender" >> "$GITHUB_ENV"

      - name: Render one native 1080p frame
        id: smoke-render
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          output="$GITHUB_WORKSPACE/artifacts/final_v08_smoke"
          xvfb-run -a "$BLENDER_EXE" \
            --background \
            --factory-startup \
            --python-exit-code 1 \
            --python tools/blender_heart_cycle/heart_cycle_final_export_v08.py \
            -- \
            --output-root "$output" \
            --frame-start 1 \
            --frame-end 1 \
            --animation-resolution 1080 \
            --sample-step 1 \
            --render-samples 128 \
            --save-blend 2>&1 | tee heart_final_v08_smoke.log

      - name: Verify native 1080p smoke output
        if: steps.smoke-render.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          root="artifacts/final_v08_smoke"
          frame="$root/final_frames/heart_cycle_final_0001.png"
          blend="$root/heart_cutaway_reference_layout_v05_phase_rig_v03_infographic_v04_presentation_v06_animation_v07_final_v08.blend"
          manifest="$root/heart_cycle_final_v08_shard_0001_0001.json"
          test -s "$frame"
          test -s "$blend"
          test -s "$manifest"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$frame")" = "1920"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$frame")" = "1080"
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("artifacts/final_v08_smoke/heart_cycle_final_v08_shard_0001_0001.json")
              .read_text(encoding="utf-8")
          )
          assert payload["final_export_revision"] == "heart_cycle_final_export_v08"
          assert payload["quality"]["width"] == 1920
          assert payload["quality"]["height"] == 1080
          assert payload["quality"]["fps"] == 30
          assert payload["quality"]["source_is_native_blender_render"] is True
          assert payload["quality"]["upscaled_from_preview"] is False
          PY

      - name: Upload 1080p smoke artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heart-final-v08-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/final_v08_smoke/**
            heart_final_v08_smoke.log
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Require successful 1080p smoke render
        if: steps.smoke-render.outcome != 'success'
        run: exit 1
