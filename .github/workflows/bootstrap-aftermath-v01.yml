name: Bootstrap aftermath v01

on:
  push:
    branches:
      - feature/aftermath-v01
    paths:
      - ".github/workflows/bootstrap-aftermath-v01.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-aftermath-v01
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/aftermath-v01
          fetch-depth: 0

      - name: Install pinned audio toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          python -m pip install --disable-pip-version-check --upgrade "numpy==2.3.5"

      - name: Expand text implementation
        run: |
          cat tools/audio/aftermath_v01_bundle.part* | tr -d '\n\r' | base64 --decode > /tmp/aftermath-v01-text.tar.gz
          tar -xzf /tmp/aftermath-v01-text.tar.gz

      - name: Render exact Linux master
        run: |
          python -m py_compile tools/audio/generate_aftermath_v01.py
          python tools/audio/generate_aftermath_v01.py \
            --score assets/audio/music/source/aftermath_v01_score.json \
            --output build/audio/aftermath_v01
          cp build/audio/aftermath_v01/aftermath_v01_master.ogg \
            assets/audio/music/exports/aftermath_v01_master.ogg
          cp build/audio/aftermath_v01/aftermath_v01_master_manifest.json \
            assets/audio/music/source/aftermath_v01_master_manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("data/audio/music_catalog.json")
          catalog = json.loads(path.read_text(encoding="utf-8"))
          catalog["asset_status"] = "main_theme_exploration_combat_start_and_aftermath_integrated"
          track = catalog["tracks"]["aftermath"]
          track["path"] = "res://assets/audio/music/exports/aftermath_v01_master.ogg"
          track["enabled"] = True
          path.write_text(json.dumps(catalog, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Validate generated implementation
        run: |
          python tests/test_aftermath_v01.py
          python tests/test_music_system_foundation.py
          python tests/test_exploration_tension_v01.py

      - name: Commit implementation and master
        env:
          HEAD_BRANCH: feature/aftermath-v01
        run: |
          rm tools/audio/aftermath_v01_bundle.part*
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/audio/music data/audio docs project.godot scripts tests tools/audio
          git commit -m "feat(audio): добавить aftermath победы v01"
          git push origin "HEAD:${HEAD_BRANCH}"

      - name: Upload listening artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aftermath-v01-bootstrap-preview
          path: build/audio/aftermath_v01/
          if-no-files-found: ignore
          retention-days: 14
