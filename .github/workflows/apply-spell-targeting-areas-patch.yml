name: Finalize spell targeting areas patch

on:
  pull_request:
    branches:
      - feature/spellcasting-progression-components
    paths:
      - ".github/workflows/apply-spell-targeting-areas-patch.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/spell-targeting-areas
          fetch-depth: 0

      - name: Use the caster class ability for Burning Hands
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("data/abilities/abilities.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          spell = data.get("burning_hands", {})
          spell.pop("ability", None)
          data["burning_hands"] = spell
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Commit correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/abilities/abilities.json
          if git diff --cached --quiet; then
            echo "No correction required."
            exit 0
          fi
          git commit -m "fix: use class spellcasting ability for area spells"
          git push origin HEAD:feature/spell-targeting-areas
