name: Apply spell targeting areas patch

on:
  pull_request:
    branches:
      - feature/spellcasting-progression-components
    paths:
      - ".github/workflows/apply-spell-targeting-areas-patch.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/spell-targeting-areas
          fetch-depth: 0

      - name: Apply deterministic patch
        run: |
          if grep -q "SPELL_AREA_COLOR" scripts/game/battle_grid.gd; then
            echo "Area patch is already applied."
            exit 0
          fi
          python tools/maintenance/apply_spell_targeting_areas_patch.py

      - name: Commit patched files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/systems/spell_area_system.gd scripts/game/battle_grid.gd scripts/systems/class_ability_system.gd scripts/systems/spellcasting_system.gd scripts/game/game_srd_combat.gd data/abilities/abilities.json data/classes/classes.json
          if git diff --cached --quiet; then
            echo "No area changes to commit."
            exit 0
          fi
          git commit -m "feat: implement spell area targeting and multi-target resolution"
          git push origin HEAD:feature/spell-targeting-areas
