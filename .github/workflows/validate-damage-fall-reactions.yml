name: Validate damage and fall reactions

on:
  pull_request:
    paths:
      - "data/abilities/abilities.json"
      - "data/classes/classes.json"
      - "scenes/game/game.tscn"
      - "scripts/game/game_damage_fall_reactions_runtime.gd"
      - "scripts/systems/damage_fall_reaction_system.gd"
      - "scripts/systems/reaction_opportunity_system.gd"
      - "tests/test_damage_fall_reactions_hellish_rebuke_slow_fall.gd"
      - "tests/smoke_damage_fall_reactions_runtime.gd"
      - "tests/smoke_defensive_reactions_runtime.gd"
      - "tests/smoke_reaction_list_vicious_mockery.gd"
      - "tests/smoke_spell_reaction_prompt.gd"
      - ".github/workflows/validate-damage-fall-reactions.yml"
  push:
    branches:
      - feature/damage-fall-reactions-hellish-rebuke-slow-fall
    paths:
      - "data/abilities/abilities.json"
      - "data/classes/classes.json"
      - "scenes/game/game.tscn"
      - "scripts/game/game_damage_fall_reactions_runtime.gd"
      - "scripts/systems/damage_fall_reaction_system.gd"
      - "scripts/systems/reaction_opportunity_system.gd"
      - "tests/test_damage_fall_reactions_hellish_rebuke_slow_fall.gd"
      - "tests/smoke_damage_fall_reactions_runtime.gd"
      - "tests/smoke_defensive_reactions_runtime.gd"
      - "tests/smoke_reaction_list_vicious_mockery.gd"
      - "tests/smoke_spell_reaction_prompt.gd"
      - ".github/workflows/validate-damage-fall-reactions.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Godot 4.7.1 Standard
        shell: bash
        run: |
          curl --location --fail --retry 3 --output godot.zip "https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.1"
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Import project and reject parser errors
        shell: bash
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE" --quit

      - name: Validate damage and fall reaction rules
        shell: bash
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/test_damage_fall_reactions_hellish_rebuke_slow_fall.gd

      - name: Validate inherited defensive reactions
        shell: bash
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/test_defensive_reactions_shield_absorb_elements.gd

      - name: Validate inherited Counterspell reaction list
        shell: bash
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_spell_reaction_prompt.gd

      - name: Validate inherited reaction list and Vicious Mockery
        shell: bash
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_reaction_list_vicious_mockery.gd

      - name: Validate inherited defensive runtime
        shell: bash
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_defensive_reactions_runtime.gd

      - name: Smoke test damage and fall runtime
        shell: bash
        run: |
          set +e
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_damage_fall_reactions_runtime.gd 2>&1 | tee damage-fall-reactions-runtime.log
          status=${PIPESTATUS[0]}
          echo "godot_exit_status=${status}" | tee -a damage-fall-reactions-runtime.log
          exit "${status}"

      - name: Upload damage and fall diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: damage-fall-reactions-runtime
          path: damage-fall-reactions-runtime.log
          if-no-files-found: warn
          retention-days: 7
