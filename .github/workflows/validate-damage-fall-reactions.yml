name: Validate damage and fall reactions

on:
  pull_request:
    paths:
      - "data/abilities/abilities.json"
      - "data/classes/classes.json"
      - "scenes/game/game.tscn"
      - "scripts/game/game_damage_fall_reactions_runtime.gd"
      - "scripts/systems/damage_fall_reaction_system.gd"
      - "scripts/systems/reaction_opportunity_system.gd"
      - "tests/test_damage_fall_reactions_hellish_rebuke_slow_fall.gd"
      - "tests/smoke_damage_fall_reactions_runtime.gd"
      - "tests/smoke_defensive_reactions_runtime.gd"
      - "tests/smoke_reaction_list_vicious_mockery.gd"
      - "tests/smoke_spell_reaction_prompt.gd"
      - ".github/workflows/validate-damage-fall-reactions.yml"
  push:
    branches:
      - feature/damage-fall-reactions-hellish-rebuke-slow-fall
    paths:
      - "data/abilities/abilities.json"
      - "data/classes/classes.json"
      - "scenes/game/game.tscn"
      - "scripts/game/game_damage_fall_reactions_runtime.gd"
      - "scripts/systems/damage_fall_reaction_system.gd"
      - "scripts/systems/reaction_opportunity_system.gd"
      - "tests/test_damage_fall_reactions_hellish_rebuke_slow_fall.gd"
      - "tests/smoke_damage_fall_reactions_runtime.gd"
      - "tests/smoke_defensive_reactions_runtime.gd"
      - "tests/smoke_reaction_list_vicious_mockery.gd"
      - "tests/smoke_spell_reaction_prompt.gd"
      - ".github/workflows/validate-damage-fall-reactions.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Godot 4.7.1 Standard
        shell: bash
        run: |
          curl --location --fail --retry 3 --output godot.zip "https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.1"
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Import project and reject parser errors
        shell: bash
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE" --quit

      - name: Run complete damage and fall reaction suite
        shell: bash
        run: |
          set +e
          : > damage-fall-reactions-suite.log
          overall=0
          run_test() {
            label="$1"
            script="$2"
            echo "===== ${label} =====" | tee -a damage-fall-reactions-suite.log
            ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script "${script}" 2>&1 | tee -a damage-fall-reactions-suite.log
            status=${PIPESTATUS[0]}
            echo "exit_status=${status}" | tee -a damage-fall-reactions-suite.log
            if [ "${status}" -ne 0 ]; then overall=1; fi
          }
          run_test "Damage and fall rules" "res://tests/test_damage_fall_reactions_hellish_rebuke_slow_fall.gd"
          run_test "Defensive reaction rules" "res://tests/test_defensive_reactions_shield_absorb_elements.gd"
          run_test "Counterspell runtime" "res://tests/smoke_spell_reaction_prompt.gd"
          run_test "Reaction list and Vicious Mockery" "res://tests/smoke_reaction_list_vicious_mockery.gd"
          run_test "Defensive reaction runtime" "res://tests/smoke_defensive_reactions_runtime.gd"
          run_test "Damage and fall runtime" "res://tests/smoke_damage_fall_reactions_runtime.gd"
          exit "${overall}"

      - name: Upload damage and fall diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: damage-fall-reactions-suite
          path: damage-fall-reactions-suite.log
          if-no-files-found: warn
          retention-days: 7
