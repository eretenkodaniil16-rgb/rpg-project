name: Validate loading screen textures

on:
  pull_request:
    paths:
      - "assets/branding/loading_screen/**"
      - "scenes/ui/loading_progress_bar_v03.tscn"
      - "scenes/menus/loading_screen_texture_preview.tscn"
      - "scripts/ui/loading_progress_bar_v03.gd"
      - "scripts/menus/loading_screen_texture_preview.gd"
      - "tests/test_loading_screen_textures.py"
      - "tests/smoke_loading_screen_textures.gd"
      - "docs/LOADING_SCREEN_TEXTURES_V01.md"
      - ".github/workflows/validate-loading-screen-textures.yml"
  push:
    branches:
      - art/loading-screen-textures-v01

concurrency:
  group: loading-screen-textures-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Validate texture dimensions, alpha and contracts
        run: python tests/test_loading_screen_textures.py

      - name: Download Godot 4.7.1 Standard
        shell: bash
        run: |
          curl --location --fail --retry 3 \
            --output godot.zip \
            "https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Import project and reject parser errors
        shell: bash
        run: |
          rm -rf .godot
          set -o pipefail
          timeout 180s ./Godot_v4.7.1-stable_linux.x86_64 \
            --headless --editor --path "$GITHUB_WORKSPACE" --quit \
            2>&1 | tee loading-screen-import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" loading-screen-import.log; then
            exit 1
          fi

      - name: Smoke test modular loading bar
        shell: bash
        run: |
          timeout 120s ./Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path "$GITHUB_WORKSPACE" \
            --script res://tests/smoke_loading_screen_textures.gd \
            2>&1 | tee loading-screen-smoke.log
          grep -F "Loading screen texture smoke test passed" loading-screen-smoke.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loading-screen-texture-diagnostics
          path: |
            loading-screen-import.log
            loading-screen-smoke.log
          if-no-files-found: ignore
          retention-days: 7
