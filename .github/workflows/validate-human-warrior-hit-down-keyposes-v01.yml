name: Validate human warrior hit down grips cycle v01

on:
  pull_request:
    paths:
      - "tools/blender_sprite_factory/hit_down_keyposes_profile_v01.py"
      - "tools/blender_sprite_factory/hit_down_cycle_profile_v01.py"
      - "tools/blender_sprite_factory/hit_down_twohand_cycle_profile_v01.py"
      - "tools/blender_sprite_factory/hit_down_keyposes_builder_v01.py"
      - "tools/blender_sprite_factory/blender_sprite_factory_hit_down_keyposes_v01.py"
      - "tools/blender_sprite_factory/tests/test_hit_down_keyposes_v01.py"
      - "docs/HUMAN_WARRIOR_HIT_DOWN_KEYPOSES_V01.md"
      - ".github/workflows/validate-human-warrior-hit-down-keyposes-v01.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: human-warrior-hit-down-grips-cycle-v01-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  render-hit-down-grips-cycle-v01:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'tools/human-warrior-hit-down-keyposes-v01'
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run focused static tests
        env:
          PYTHONPATH: tools/blender_sprite_factory
        run: |
          python -m unittest \
            tools.blender_sprite_factory.tests.test_hit_down_keyposes_v01

      - name: Install headless render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1 libxi6 libxrender1 libxkbcommon-x11-0

      - name: Download and verify Blender 5.2.0 LTS
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/blender-5.2.0-linux-x64.tar.xz"
          extract="$RUNNER_TEMP/blender-5.2.0"
          curl \
            --location \
            --fail \
            --retry 4 \
            --retry-all-errors \
            --connect-timeout 20 \
            --max-time 300 \
            --output "$archive" \
            "https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz"
          actual="$(sha256sum "$archive" | cut -d' ' -f1)"
          expected="96f6c181a30f4950607839dc84d42a354b250d8a0231b098b59b7bc69c351c48"
          test "$actual" = "$expected"
          mkdir -p "$extract"
          tar -xJf "$archive" -C "$extract"
          blender="$(find "$extract" -type f -name blender -perm -111 | head -n 1)"
          test -n "$blender"
          echo "BLENDER_EXE=$blender" >> "$GITHUB_ENV"

      - name: Render onehand and twohand hit_down cycles
        id: blender-hit-down
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          run_id="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          xvfb-run -a "$BLENDER_EXE" \
            --background \
            --factory-startup \
            --python-exit-code 1 \
            --python tools/blender_sprite_factory/blender_sprite_factory_hit_down_keyposes_v01.py \
            -- \
            --repo-root "$GITHUB_WORKSPACE" \
            --config tools/blender_sprite_factory/configs/human_warrior_m01.json \
            --run-id "$run_id" \
            --mode all 2>&1 | tee blender_hit_down_grips_cycle_v01.log

      - name: Upload hit_down grip cycles and source blend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: human_warrior_m01_hit_down_grips_cycle_v01_${{ github.run_id }}_${{ github.run_attempt }}
          path: |
            art/blender_pipeline_runs/human_warrior_m01/**
            blender_hit_down_grips_cycle_v01.log
          if-no-files-found: warn
          retention-days: 14

      - name: Require successful hit_down grip render
        if: steps.blender-hit-down.outcome != 'success'
        run: |
          echo "hit_down grips cycle v01 failed; inspect the uploaded artifact."
          exit 1
