name: Bootstrap exploration tension v01

on:
  push:
    branches:
      - feature/exploration-tension-v01

permissions:
  contents: write

concurrency:
  group: bootstrap-exploration-tension-v01
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/exploration-tension-v01

      - name: Restore reviewed source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat tools/audio/bootstrap/exploration_tension_bundle_*.txt | base64 --decode > /tmp/exploration-tension-bundle.tar.gz
          tar --extract --gzip --file /tmp/exploration-tension-bundle.tar.gz --directory "$GITHUB_WORKSPACE"

      - name: Install audio toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          python -m pip install --disable-pip-version-check numpy

      - name: Render game master
        run: |
          python tools/audio/generate_exploration_tension_v01.py \
            --score assets/audio/music/source/exploration_tension_v01_score.json \
            --output build/audio/exploration_tension_v01
          mkdir -p assets/audio/music/exports assets/audio/music/source
          cp build/audio/exploration_tension_v01/exploration_tension_v01_master.ogg \
            assets/audio/music/exports/exploration_tension_v01_master.ogg
          cp build/audio/exploration_tension_v01/exploration_tension_v01_master_manifest.json \
            assets/audio/music/source/exploration_tension_v01_master_manifest.json

      - name: Validate staged resource
        run: |
          python tests/test_exploration_tension_v01.py
          python tests/test_music_system_foundation.py

      - name: Replace bootstrap with final implementation
        shell: bash
        run: |
          set -euo pipefail
          git rm -r tools/audio/bootstrap
          git rm .github/workflows/bootstrap-exploration-tension-v01.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(audio): добавить exploration tension и resolver угрозы"
          git push origin HEAD:feature/exploration-tension-v01
