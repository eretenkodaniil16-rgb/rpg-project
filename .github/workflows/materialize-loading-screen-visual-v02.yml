name: Materialize loading screen visual v02

on:
  push:
    branches:
      - art/loading-screen-visual-v02
    paths:
      - "tools/loading_screen_visual_v02_transport/READY"

permissions:
  contents: write

concurrency:
  group: materialize-loading-screen-visual-v02
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and verify patch archive
        shell: bash
        run: |
          set -euo pipefail
          cat tools/loading_screen_visual_v02_transport/parts/part_*.b64 > /tmp/loading_screen_visual_v02_patch.b64
          base64 --decode /tmp/loading_screen_visual_v02_patch.b64 > /tmp/loading_screen_visual_v02_patch.tar.gz
          echo "f6d2723ac8123a538b62513dd22b2c0910778034c4c11e37962110635652b544  /tmp/loading_screen_visual_v02_patch.tar.gz" | sha256sum --check
          tar -tzf /tmp/loading_screen_visual_v02_patch.tar.gz > /tmp/loading_screen_visual_v02_patch_files.txt
          grep -F "scenes/menus/loading_screen_visual_v02.tscn" /tmp/loading_screen_visual_v02_patch_files.txt
          grep -F "tests/test_loading_screen_visual_v02.py" /tmp/loading_screen_visual_v02_patch_files.txt

      - name: Materialize approved assets and code
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/loading_screen_visual_v02_patch.tar.gz -C "$GITHUB_WORKSPACE"
          git fetch --depth=1 origin art/loading-screen-textures-v01
          git checkout FETCH_HEAD -- \
            assets/branding/loading_screen/approved/loading_bar_v03/loading_bar_center_rune_v03.png \
            assets/branding/loading_screen/approved/loading_bar_v03/loading_bar_fill_v03.png \
            assets/branding/loading_screen/approved/loading_bar_v03/loading_bar_glint_v03.png \
            assets/branding/loading_screen/approved/loading_bar_v03/loading_bar_left_cap_v03.png \
            assets/branding/loading_screen/approved/loading_bar_v03/loading_bar_track_v03.png \
            scenes/ui/loading_progress_bar_v03.tscn \
            scripts/ui/loading_progress_bar_v03.gd
          rm -rf assets/branding/loading_screen/embedded/loading_screen_visual_v02
          rm -rf tools/loading_screen_visual_v02_transport
          rm -f .github/workflows/materialize-loading-screen-visual-v02.yml

      - name: Validate materialized package
        shell: bash
        run: |
          set -euo pipefail
          python tests/test_loading_screen_visual_v02.py
          test "$(find assets/branding/loading_screen/approved/loading_screen_visual_v02/background/strips -name '*.webp' | wc -l)" -eq 24
          test "$(find assets/branding/loading_screen/approved/loading_screen_visual_v02/logo/strips -name '*.webp' | wc -l)" -eq 16
          test "$(find assets/branding/loading_screen/approved/loading_screen_visual_v02/vfx/circle_strips -name '*.webp' | wc -l)" -eq 6
          if find assets/branding/loading_screen/approved/loading_screen_visual_v02 -type f -size +16k | grep -q .; then
            echo "A loading screen binary exceeds the transport-safe limit."
            exit 1
          fi

      - name: Commit materialized package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "art: материализовать loading screen visual v02"
          git push origin HEAD:art/loading-screen-visual-v02
