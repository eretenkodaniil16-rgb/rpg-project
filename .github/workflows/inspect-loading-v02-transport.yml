name: Inspect loading v02 bundles

on:
  push:
    branches:
      - tmp/loading-blob-transport-check
    paths:
      - ".github/workflows/inspect-loading-v02-transport.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout scratch branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect merged bundle containers
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- tools/loading_screen_visual_v02_transport/bundles
          for source in tools/loading_screen_visual_v02_transport/bundles/bundle_*.b64; do
            name="$(basename "$source" .b64)"
            decoded="/tmp/${name}.bin"
            base64 --decode "$source" > "$decoded"
            echo "=== $name ==="
            stat -c 'bytes=%s' "$decoded"
            sha256sum "$decoded"
            file "$decoded"
            if tar -tzf "$decoded" >/tmp/${name}.list 2>/dev/null; then
              echo "--- TAR CONTENTS ---"
              cat /tmp/${name}.list
            else
              echo "--- GZIP TEXT HEAD ---"
              gzip -dc "$decoded" 2>/dev/null | sed -n '1,120p' || true
            fi
          done
