name: Inspect loading blob transport

on:
  push:
    branches:
      - tmp/loading-blob-transport-check
    paths:
      - ".github/workflows/inspect-loading-v02-transport.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout scratch branch
        uses: actions/checkout@v4

      - name: Verify transported c00 bytes
        shell: bash
        run: |
          set -euo pipefail
          FILE="tmp/loading_blob_transport_check_c00.webp"
          test -f "$FILE"
          test "$(stat -c%s "$FILE")" -eq 4276
          echo "e0ed039da3b1f73dca928747e78630567900477c9343f4f182a3661a670208cc  $FILE" | sha256sum --check
          file "$FILE"
          echo "LOADING_BLOB_TRANSPORT_OK"
