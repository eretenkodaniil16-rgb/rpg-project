name: Validate squad tactical plans

on:
  pull_request:
    paths:
      - "data/ai/squad_tactical_plans.json"
      - "scripts/systems/squad_tactical_plan_system.gd"
      - "scripts/systems/squad_plan_npc_ai_system.gd"
      - "scripts/game/game_squad_tactical_plans_runtime.gd"
      - "scripts/game/stealth_test_room.gd"
      - "scenes/game/game.tscn"
      - "tests/test_squad_tactical_plan_system.gd"
      - "tests/smoke_squad_tactical_plans_runtime.gd"
      - "tests/smoke_movement_wall_integrity.gd"
      - ".github/workflows/validate-squad-tactical-plans.yml"
  push:
    branches:
      - feature/squad-tactical-plans

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Godot 4.7.1 Standard
        shell: bash
        run: |
          curl --location --fail --retry 3 --output godot.zip "https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.1"
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Import project and reject parser errors
        shell: bash
        run: |
          rm -rf .godot
          set -o pipefail
          timeout 150s ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE" --quit 2>&1 | tee squad-plan-import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" squad-plan-import.log; then
            exit 1
          fi

      - name: Validate plan priority, persistence, roles and failure memory
        shell: bash
        run: timeout 180s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/test_squad_tactical_plan_system.gd 2>&1 | tee squad-plan-unit.log

      - name: Smoke test role coordination, reservations and sector search
        shell: bash
        run: timeout 210s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_squad_tactical_plans_runtime.gd 2>&1 | tee squad-plan-smoke.log

      - name: Simulate walls, doors, jump restrictions and visible tactical roles
        shell: bash
        run: timeout 240s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_movement_wall_integrity.gd 2>&1 | tee movement-integrity.log

      - name: Regression test environment-reactive AI
        shell: bash
        run: timeout 180s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_environment_reactive_ai_runtime.gd 2>&1 | tee environment-regression.log

      - name: Regression test nonlethal attacks and restraints
        shell: bash
        run: timeout 180s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_corpse_interactions_runtime.gd 2>&1 | tee nonlethal-regression.log

      - name: Regression test advanced tactical AI
        shell: bash
        run: timeout 180s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_advanced_combat_ai_runtime.gd 2>&1 | tee advanced-ai-regression.log

      - name: Regression test integrated v0.18 contract
        shell: bash
        run: timeout 180s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/test_v018_integration_stack.gd 2>&1 | tee v018-regression.log

      - name: Upload squad plan diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: squad-tactical-plans-diagnostics
          path: |
            squad-plan-import.log
            squad-plan-unit.log
            squad-plan-smoke.log
            movement-integrity.log
            environment-regression.log
            nonlethal-regression.log
            advanced-ai-regression.log
            v018-regression.log
          retention-days: 7
