name: Validate Godot project

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Godot 4.7.1 Standard
        shell: bash
        run: |
          curl --location --fail --retry 3 \
            --output godot.zip \
            "https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.1"
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Import and validate project
        shell: bash
        run: |
          ./Godot_v4.7.1-stable_linux.x86_64 \
            --headless --editor --path "$GITHUB_WORKSPACE" --quit

      - name: Run character creation tests
        shell: bash
        run: |
          ./Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path "$GITHUB_WORKSPACE" \
            --script res://tests/test_character_creation.gd

      - name: Run skill check tests
        shell: bash
        run: |
          ./Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path "$GITHUB_WORKSPACE" \
            --script res://tests/test_skill_checks.gd

      - name: Run combat system tests
        shell: bash
        run: |
          ./Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path "$GITHUB_WORKSPACE" \
            --script res://tests/test_combat_system.gd

      - name: Smoke test character creator scene
        shell: bash
        run: |
          ./Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path "$GITHUB_WORKSPACE" \
            --script res://tests/smoke_character_creator.gd

      - name: Smoke test character sheet
        shell: bash
        run: |
          ./Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path "$GITHUB_WORKSPACE" \
            --script res://tests/smoke_character_sheet.gd

      - name: Smoke test checked dialogue
        shell: bash
        run: |
          ./Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path "$GITHUB_WORKSPACE" \
            --script res://tests/smoke_dialogue_skill_check.gd

      - name: Smoke test training dummy
        shell: bash
        run: |
          ./Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path "$GITHUB_WORKSPACE" \
            --script res://tests/smoke_training_dummy.gd

      - name: Run runtime checks with diagnostics
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build/test"
          set +e

          ./Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path "$GITHUB_WORKSPACE" \
            --script res://tests/smoke_player_name.gd \
            2>&1 | tee "$GITHUB_WORKSPACE/build/test/player-name-command.log"
          name_status=${PIPESTATUS[0]}

          ./Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path "$GITHUB_WORKSPACE" \
            --script res://tests/smoke_player_color.gd \
            2>&1 | tee "$GITHUB_WORKSPACE/build/test/player-color-command.log"
          color_status=${PIPESTATUS[0]}

          ./Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path "$GITHUB_WORKSPACE" \
            --script res://tests/test_player_mobile_input.gd \
            2>&1 | tee "$GITHUB_WORKSPACE/build/test/mobile-input-command.log"
          input_status=${PIPESTATUS[0]}

          ./Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path "$GITHUB_WORKSPACE" \
            --script res://tests/smoke_mobile_controls.gd \
            2>&1 | tee "$GITHUB_WORKSPACE/build/test/mobile-controls-command.log"
          controls_status=${PIPESTATUS[0]}

          printf 'name=%s\ncolor=%s\ninput=%s\ncontrols=%s\n' \
            "$name_status" "$color_status" "$input_status" "$controls_status" \
            > "$GITHUB_WORKSPACE/build/test/runtime-status.txt"
          exit 0

      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-test-diagnostics
          path: build/test/
          if-no-files-found: error
          retention-days: 7

      - name: Verify runtime test status
        shell: bash
        run: |
          grep -q '^name=0$' build/test/runtime-status.txt
          grep -q '^color=0$' build/test/runtime-status.txt
          grep -q '^input=0$' build/test/runtime-status.txt
          grep -q '^controls=0$' build/test/runtime-status.txt
