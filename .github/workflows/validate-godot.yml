name: Validate Godot project

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Godot 4.7.1 Standard
        shell: bash
        run: |
          curl --location --fail --retry 3 \
            --output godot.zip \
            "https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.1"
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Import and validate project
        shell: bash
        run: |
          ./Godot_v4.7.1-stable_linux.x86_64 \
            --headless \
            --editor \
            --path "$GITHUB_WORKSPACE" \
            --quit

      - name: Run character creation tests
        shell: bash
        run: |
          ./Godot_v4.7.1-stable_linux.x86_64 \
            --headless \
            --path "$GITHUB_WORKSPACE" \
            --script res://tests/test_character_creation.gd

      - name: Smoke test character creator scene
        shell: bash
        run: |
          ./Godot_v4.7.1-stable_linux.x86_64 \
            --headless \
            --path "$GITHUB_WORKSPACE" \
            --script res://tests/smoke_character_creator.gd

      - name: Smoke test player appearance and movement
        shell: bash
        run: |
          ./Godot_v4.7.1-stable_linux.x86_64 \
            --headless \
            --path "$GITHUB_WORKSPACE" \
            --script res://tests/smoke_player_runtime.gd
