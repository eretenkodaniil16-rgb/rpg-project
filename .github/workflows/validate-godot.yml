name: Validate Godot project

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Godot 4.7.1 Standard
        shell: bash
        run: |
          curl --location --fail --retry 3 --output godot.zip "https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.1"
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Import and validate project
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build/test"
          set +e
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE" --quit 2>&1 | tee "$GITHUB_WORKSPACE/build/test/import.log"
          import_status=${PIPESTATUS[0]}
          echo "import=$import_status" > "$GITHUB_WORKSPACE/build/test/import-status.txt"
          exit "$import_status"

      - name: Run character creation tests
        shell: bash
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/test_character_creation.gd

      - name: Run skill check tests
        shell: bash
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/test_skill_checks.gd

      - name: Run combat system tests
        shell: bash
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/test_combat_system.gd

      - name: Run distance and ranged combat tests with diagnostics
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build/test"
          set +e
          timeout 45s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/test_distance_and_ranged_combat.gd 2>&1 | tee "$GITHUB_WORKSPACE/build/test/distance-and-ranged.log"
          distance_status=${PIPESTATUS[0]}
          echo "distance=$distance_status" > "$GITHUB_WORKSPACE/build/test/distance-status.txt"
          exit 0

      - name: Run directional targeting tests
        shell: bash
        run: timeout 45s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/test_directional_targeting.gd

      - name: Run turn based combat system tests
        shell: bash
        run: timeout 45s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/test_turn_based_combat.gd

      - name: Run SRD combat core tests with diagnostics
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build/test"
          set +e
          timeout 45s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/test_srd_combat_rules.gd 2>&1 | tee "$GITHUB_WORKSPACE/build/test/srd-combat-rules.log"
          srd_status=${PIPESTATUS[0]}
          timeout 45s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/test_area_effect_system.gd 2>&1 | tee "$GITHUB_WORKSPACE/build/test/area-effects.log"
          area_status=${PIPESTATUS[0]}
          printf 'srd=%s\narea=%s\n' "$srd_status" "$area_status" > "$GITHUB_WORKSPACE/build/test/srd-status.txt"
          exit 0

      - name: Run rest tests
        shell: bash
        run: timeout 45s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/test_rests.gd

      - name: Run quest and inventory tests
        shell: bash
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/test_quest_inventory.gd

      - name: Run class system tests with diagnostics
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build/test"
          set +e
          timeout 45s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/test_class_loadouts.gd 2>&1 | tee "$GITHUB_WORKSPACE/build/test/class-loadouts.log"
          loadout_status=${PIPESTATUS[0]}
          timeout 45s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/test_class_abilities.gd 2>&1 | tee "$GITHUB_WORKSPACE/build/test/class-abilities.log"
          ability_status=${PIPESTATUS[0]}
          printf 'loadouts=%s\nabilities=%s\n' "$loadout_status" "$ability_status" > "$GITHUB_WORKSPACE/build/test/class-status.txt"
          exit 0

      - name: Smoke test character creator scene
        shell: bash
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_character_creator.gd

      - name: Smoke test character sheet
        shell: bash
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_character_sheet.gd

      - name: Smoke test checked dialogue
        shell: bash
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_dialogue_skill_check.gd

      - name: Smoke test training dummy
        shell: bash
        run: timeout 35s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_training_dummy.gd

      - name: Smoke test quest journal and inventory
        shell: bash
        run: timeout 35s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_quest_inventory_ui.gd

      - name: Smoke test class ability panel
        shell: bash
        run: timeout 35s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_ability_panel.gd

      - name: Smoke test target controls with diagnostics
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build/test"
          set +e
          timeout 45s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_target_controls.gd 2>&1 | tee "$GITHUB_WORKSPACE/build/test/target-controls.log"
          target_status=${PIPESTATUS[0]}
          echo "target=$target_status" > "$GITHUB_WORKSPACE/build/test/target-status.txt"
          exit 0

      - name: Smoke test overlay HUD visibility
        shell: bash
        run: timeout 45s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_overlay_hud_visibility.gd

      - name: Smoke test ranged projectile
        shell: bash
        run: timeout 45s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_ranged_projectile.gd

      - name: Smoke test battle grid with diagnostics
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build/test"
          set +e
          timeout 45s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_battle_grid.gd 2>&1 | tee "$GITHUB_WORKSPACE/build/test/battle-grid.log"
          grid_status=${PIPESTATUS[0]}
          echo "grid=$grid_status" > "$GITHUB_WORKSPACE/build/test/grid-status.txt"
          exit 0

      - name: Smoke test free aim combat
        shell: bash
        run: timeout 45s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_free_aim_combat.gd

      - name: Smoke test turn based combat
        shell: bash
        run: timeout 60s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_turn_based_combat.gd

      - name: Smoke test SRD combat core with diagnostics
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build/test"
          set +e
          timeout 60s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_srd_combat_core.gd 2>&1 | tee "$GITHUB_WORKSPACE/build/test/srd-smoke.log"
          smoke_status=${PIPESTATUS[0]}
          echo "srd_smoke=$smoke_status" > "$GITHUB_WORKSPACE/build/test/srd-smoke-status.txt"
          exit 0

      - name: Run runtime checks with diagnostics
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build/test"
          set +e
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_player_name.gd 2>&1 | tee "$GITHUB_WORKSPACE/build/test/player-name-command.log"
          name_status=${PIPESTATUS[0]}
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_player_color.gd 2>&1 | tee "$GITHUB_WORKSPACE/build/test/player-color-command.log"
          color_status=${PIPESTATUS[0]}
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/test_player_mobile_input.gd 2>&1 | tee "$GITHUB_WORKSPACE/build/test/mobile-input-command.log"
          input_status=${PIPESTATUS[0]}
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_mobile_controls.gd 2>&1 | tee "$GITHUB_WORKSPACE/build/test/mobile-controls-command.log"
          controls_status=${PIPESTATUS[0]}
          printf 'name=%s\ncolor=%s\ninput=%s\ncontrols=%s\n' "$name_status" "$color_status" "$input_status" "$controls_status" > "$GITHUB_WORKSPACE/build/test/runtime-status.txt"
          exit 0

      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-test-diagnostics
          path: build/test/
          if-no-files-found: error
          retention-days: 7

      - name: Verify test status
        shell: bash
        run: |
          grep -q '^import=0$' build/test/import-status.txt
          grep -q '^distance=0$' build/test/distance-status.txt
          grep -q '^target=0$' build/test/target-status.txt
          grep -q '^grid=0$' build/test/grid-status.txt
          grep -q '^srd=0$' build/test/srd-status.txt
          grep -q '^area=0$' build/test/srd-status.txt
          grep -q '^srd_smoke=0$' build/test/srd-smoke-status.txt
          grep -q '^loadouts=0$' build/test/class-status.txt
          grep -q '^abilities=0$' build/test/class-status.txt
          grep -q '^name=0$' build/test/runtime-status.txt
          grep -q '^color=0$' build/test/runtime-status.txt
          grep -q '^input=0$' build/test/runtime-status.txt
          grep -q '^controls=0$' build/test/runtime-status.txt
