              '''

func _world_blockers_for_rect(world_rect: Rect2) -> Array[Node]:
	var blockers: Array[Node] = []
	if not is_inside_tree() or not world_rect.has_area():
		return blockers
	for blocker: Node in get_tree().get_nodes_in_group(WORLD_BLOCKER_GROUP):
		if not is_instance_valid(blocker) or not _world_blocker_blocks_movement(blocker):
			continue
		var blocker_rect: Rect2 = _world_blocker_rect(blocker)
		if blocker_rect.has_area() and blocker_rect.intersects(world_rect):
			blockers.append(blocker)
	return blockers


func _world_blocker_rect(blocker: Node) -> Rect2:
	if blocker == null:
		return Rect2()
	if blocker.has_method("get_world_rect"):
		var method_value: Variant = blocker.call("get_world_rect")
		if method_value is Rect2:
			return method_value as Rect2
	if blocker is Node2D and blocker.has_meta(WORLD_BLOCKER_SIZE_META):
		var size_value: Variant = blocker.get_meta(WORLD_BLOCKER_SIZE_META)
		if size_value is Vector2:
			var blocker_size: Vector2 = size_value as Vector2
			return Rect2((blocker as Node2D).global_position - blocker_size * 0.5, blocker_size)
	return Rect2()


func _world_blocker_blocks_movement(blocker: Node) -> bool:
	if blocker == null:
		return false
	if blocker.has_method("blocks_movement"):
		return bool(blocker.call("blocks_movement"))
	return bool(blocker.get_meta(WORLD_BLOCKER_BLOCKS_META, true))


func _world_blocker_is_jumpable(blocker: Node) -> bool:
	if blocker == null:
		return false
	if blocker.has_method("is_jumpable_obstacle"):
		return bool(blocker.call("is_jumpable_obstacle"))
	return bool(blocker.get_meta(WORLD_BLOCKER_JUMPABLE_META, false))


func _rebuild_collision_bodies() -> void:
'''
