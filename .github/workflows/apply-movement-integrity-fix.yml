name: Apply movement integrity fix

on:
  push:
    branches:
      - feature/squad-tactical-plans
    paths:
      - ".github/workflows/apply-movement-integrity-fix.yml"

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: feature/squad-tactical-plans
          fetch-depth: 0

      - name: Patch world blockers, NPC execution and visible tactical squad
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Marker not found in {path}: {old[:100]!r}")
              file_path.write_text(text.replace(old, new, 1), encoding="utf-8")

          environment_path = "scripts/game/combat_environment.gd"
