name: Validate manual sprite candidates

on:
  workflow_dispatch:
    inputs:
      frame_id:
        description: "Animation frame to validate"
        required: true
        type: choice
        default: walk_down_f01
        options:
          - walk_down_f01
          - walk_down_f02
          - walk_down_f03
          - walk_down_f04
          - walk_down_f05
          - walk_down_f06
      top_k:
        description: "Technically strongest candidates shown for art review"
        required: true
        type: choice
        default: "3"
        options:
          - "1"
          - "2"
          - "3"
          - "4"

permissions:
  contents: read

concurrency:
  group: manual-sprite-${{ github.ref }}-${{ inputs.frame_id }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: tools/sprite_pipeline
      SPRITE_FRAME_ID: ${{ inputs.frame_id }}
      SPRITE_TOP_K: ${{ inputs.top_k }}

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/sprite_pipeline/requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r tools/sprite_pipeline/requirements.txt

      - name: Resolve submission directory
        id: submission
        shell: bash
        run: |
          submission_dir="art_pipeline_submissions/human_warrior_m01/${SPRITE_FRAME_ID}"
          if [[ ! -d "$submission_dir" ]]; then
            echo "Submission directory does not exist: $submission_dir" >&2
            exit 1
          fi
          shopt -s nullglob
          png_files=("$submission_dir"/*.png)
          if (( ${#png_files[@]} == 0 )); then
            echo "No PNG candidates found in $submission_dir" >&2
            exit 1
          fi
          echo "input_dir=$submission_dir" >> "$GITHUB_OUTPUT"
          echo "Found ${#png_files[@]} PNG candidate(s)."

      - name: Run deterministic manual validation
        shell: bash
        run: |
          mkdir -p build/manual-sprite-review
          python tools/sprite_pipeline/run_pipeline.py validate \
            --frame-id "$SPRITE_FRAME_ID" \
            --input-dir "${{ steps.submission.outputs.input_dir }}" \
            --top-k "$SPRITE_TOP_K" \
            2>&1 | tee build/manual-sprite-review/validation.log

      - name: Publish review summary
        if: success()
        shell: bash
        run: |
          report_file="$(find art_pipeline_runs -type f -name report.md -print -quit)"
          if [[ -n "$report_file" ]]; then
            cat "$report_file" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload manual review package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sprite-review-manual-${{ inputs.frame_id }}-${{ github.run_number }}
          path: |
            art_pipeline_runs/**/selected/**
            art_pipeline_runs/**/report.md
            art_pipeline_runs/**/report.json
            art_pipeline_runs/**/technical_report.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload manual diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprite-diagnostics-manual-${{ inputs.frame_id }}-${{ github.run_number }}
          path: |
            art_pipeline_runs/
            build/manual-sprite-review/
          if-no-files-found: warn
          retention-days: 7
