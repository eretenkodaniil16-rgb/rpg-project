name: Validate patrols and alert groups

on:
  pull_request:
    paths:
      - "data/world/stealth_alerts.json"
      - "data/world/patrol_alert_groups.json"
      - "scripts/systems/patrol_alert_group_system.gd"
      - "scripts/game/stealth_patrol_observer.gd"
      - "scripts/game/stealth_test_room.gd"
      - "scripts/game/game_pursuit_escape_runtime.gd"
      - "tests/test_patrol_alert_group_system.gd"
      - "tests/smoke_patrol_alert_groups.gd"
      - ".github/workflows/validate-patrol-alert-groups.yml"
  push:
    branches:
      - feature/npc-patrol-alert-groups

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Godot 4.7.1 Standard
        shell: bash
        run: |
          curl --location --fail --retry 3 --output godot.zip "https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.1"
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Import project
        shell: bash
        run: |
          rm -rf .godot
          timeout 120s ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE" --quit 2>&1 | tee patrol-alert-import.log

      - name: Validate patrol and alert group data
        shell: bash
        run: timeout 120s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/test_patrol_alert_group_system.gd 2>&1 | tee patrol-alert-unit.log

      - name: Smoke test patrol and local alert relay
        shell: bash
        run: timeout 120s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_patrol_alert_groups.gd 2>&1 | tee patrol-alert-smoke.log

      - name: Regression test exploration stealth
        shell: bash
        run: timeout 120s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_exploration_stealth_alerts.gd 2>&1 | tee exploration-stealth-regression.log

      - name: Regression test combat pursuit escape
        shell: bash
        run: timeout 120s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_hidden_combat_escape.gd 2>&1 | tee pursuit-regression.log

      - name: Upload patrol alert diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patrol-alert-diagnostics
          path: |
            patrol-alert-import.log
            patrol-alert-unit.log
            patrol-alert-smoke.log
            exploration-stealth-regression.log
            pursuit-regression.log
          retention-days: 3
