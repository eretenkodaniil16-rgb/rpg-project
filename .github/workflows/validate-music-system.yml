name: Validate music system

on:
  pull_request:
    paths:
      - "assets/audio/**"
      - "data/audio/**"
      - "scripts/audio/**"
      - "tests/test_music_manager.gd"
      - "tests/test_music_system_foundation.py"
      - "docs/AUDIO_SYSTEM.md"
      - "project.godot"
      - ".github/workflows/validate-music-system.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: music-system-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate catalog and static contracts
        run: python tests/test_music_system_foundation.py

      - name: Download Godot 4.7.1 Standard
        shell: bash
        run: |
          set -euo pipefail
          curl \
            --location \
            --fail \
            --retry 4 \
            --retry-all-errors \
            --retry-delay 3 \
            --connect-timeout 20 \
            --max-time 180 \
            --output godot.zip \
            "https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.1"
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Import project and reject parser errors
        shell: bash
        run: |
          rm -rf .godot
          set -o pipefail
          timeout 180s ./Godot_v4.7.1-stable_linux.x86_64 \
            --headless --editor --path "$GITHUB_WORKSPACE" --quit \
            2>&1 | tee music-system-import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" music-system-import.log; then
            exit 1
          fi

      - name: Test music manager runtime contracts
        shell: bash
        run: |
          timeout 90s ./Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path "$GITHUB_WORKSPACE" \
            --script res://tests/test_music_manager.gd \
            2>&1 | tee music-system-test.log
          grep -F "Music manager tests passed." music-system-test.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: music-system-diagnostics
          path: |
            music-system-import.log
            music-system-test.log
          if-no-files-found: ignore
          retention-days: 7
