name: Patch death03 split composition v01

on:
  push:
    branches:
      - tools/human-warrior-death-down-keyposes-v01
    paths:
      - ".github/workflows/patch-death03-split-composition-v01.yml"
      - "tools/blender_sprite_factory/patch_death03_split_composition_v01.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Checkout art branch
        uses: actions/checkout@v4
        with:
          ref: tools/human-warrior-death-down-keyposes-v01

      - name: Apply split composition correction
        run: python tools/blender_sprite_factory/patch_death03_split_composition_v01.py

      - name: Compile and run focused tests
        env:
          PYTHONPATH: .
        run: |
          python -m py_compile \
            tools/blender_sprite_factory/death_down_keyposes_builder_v01.py \
            tools/blender_sprite_factory/blender_sprite_factory_death_down_keyposes_v01.py
          python -m unittest tools.blender_sprite_factory.tests.test_death_down_keyposes_v01

      - name: Commit permanent correction
        shell: bash
        run: |
          set -euo pipefail
          git add \
            tools/blender_sprite_factory/death_down_keyposes_builder_v01.py \
            tools/blender_sprite_factory/blender_sprite_factory_death_down_keyposes_v01.py
          if git diff --cached --quiet; then
            echo "Composition correction is already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: развести туловище и ноги death_03 по диагонали"
          git push origin HEAD:tools/human-warrior-death-down-keyposes-v01
