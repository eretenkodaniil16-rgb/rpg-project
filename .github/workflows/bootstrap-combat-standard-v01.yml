name: Bootstrap combat standard v01

on:
  push:
    branches:
      - feature/combat-standard-v01
    paths:
      - "tools/audio/combat_standard_v01_bootstrap.tar.gz"
      - ".github/workflows/bootstrap-combat-standard-v01.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-combat-standard-v01
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/combat-standard-v01
          fetch-depth: 0

      - name: Install pinned audio toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          python -m pip install --disable-pip-version-check --upgrade "numpy==2.3.5"

      - name: Expand approved source bundle
        run: tar -xzf tools/audio/combat_standard_v01_bootstrap.tar.gz

      - name: Render Linux game master
        run: |
          python -m py_compile tools/audio/generate_combat_standard_v01.py
          python tools/audio/generate_combat_standard_v01.py \
            --score assets/audio/music/source/combat_standard_v01_score.json \
            --output build/audio/combat_standard_v01
          cp build/audio/combat_standard_v01/combat_standard_v01_master.ogg \
            assets/audio/music/exports/combat_standard_v01_master.ogg
          cp build/audio/combat_standard_v01/combat_standard_v01_master_manifest.json \
            assets/audio/music/source/combat_standard_v01_master_manifest.json

      - name: Enable catalog track
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("data/audio/music_catalog.json")
          catalog = json.loads(path.read_text(encoding="utf-8"))
          catalog["asset_status"] = "main_theme_exploration_and_standard_combat_integrated"
          catalog["tracks"]["combat_standard"] = {
              "path": "res://assets/audio/music/exports/combat_standard_v01_master.ogg",
              "enabled": True,
              "bus": "Music",
              "volume_db": -4.5,
              "loop": True,
              "render_status": "master_candidate",
              "composition_id": "combat_standard_v01",
              "render_id": "combat_standard_v01_master_candidate_01",
              "arrangement_revision": 1,
              "combat_profile": "standard_turn_based",
          }
          path.write_text(json.dumps(catalog, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Validate generated contracts
        run: |
          python tests/test_combat_standard_v01.py
          python tests/test_music_system_foundation.py

      - name: Commit generated master and sources
        env:
          HEAD_BRANCH: feature/combat-standard-v01
        run: |
          rm tools/audio/combat_standard_v01_bootstrap.tar.gz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio/music/source/combat_standard_v01_score.json
          git add assets/audio/music/source/combat_standard_v01_provenance.json
          git add assets/audio/music/source/combat_standard_v01_master_manifest.json
          git add -f assets/audio/music/exports/combat_standard_v01_master.ogg
          git add data/audio/music_catalog.json
          git add docs/COMBAT_STANDARD_V01.md
          git add tests/test_combat_standard_v01.py
          git add tests/test_combat_standard_music.gd
          git add tools/audio/generate_combat_standard_v01.py
          git add -u tools/audio/combat_standard_v01_bootstrap.tar.gz
          git commit -m "feat(audio): добавить базовую боевую тему v01"
          git push origin "HEAD:${HEAD_BRANCH}"

      - name: Upload listening artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combat-standard-v01-bootstrap-preview
          path: build/audio/combat_standard_v01/
          if-no-files-found: ignore
          retention-days: 14
