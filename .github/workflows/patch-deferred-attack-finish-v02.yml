name: Patch deferred attack finish v02

on:
  push:
    branches:
      - feature/human-warrior-runtime-animation-v02
    paths:
      - ".github/workflows/patch-deferred-attack-finish-v02.yml"
      - "tools/runtime_animation/patch_deferred_attack_finish_v02.py"

permissions:
  contents: write

concurrency:
  group: patch-deferred-attack-finish-v02-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Checkout runtime branch
        uses: actions/checkout@v4
        with:
          ref: feature/human-warrior-runtime-animation-v02

      - name: Apply deferred finish patch
        run: python tools/runtime_animation/patch_deferred_attack_finish_v02.py

      - name: Commit production fix
        shell: bash
        run: |
          set -euo pipefail
          git add scripts/game/player.gd
          if git diff --cached --quiet; then
            echo "Deferred finish patch is already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: завершать sword attack после animation_finished callback"
          git push origin HEAD:feature/human-warrior-runtime-animation-v02
