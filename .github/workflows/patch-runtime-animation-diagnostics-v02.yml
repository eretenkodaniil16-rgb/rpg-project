name: Patch runtime animation diagnostics v02

on:
  push:
    branches:
      - feature/human-warrior-runtime-animation-v02
    paths:
      - ".github/workflows/patch-runtime-animation-diagnostics-v02.yml"
      - "tools/runtime_animation/patch_runtime_animation_diagnostics_v02.py"

permissions:
  contents: write

concurrency:
  group: patch-runtime-animation-diagnostics-v02-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Checkout runtime branch
        uses: actions/checkout@v4
        with:
          ref: feature/human-warrior-runtime-animation-v02

      - name: Apply diagnostics patch
        run: python3 tools/runtime_animation/patch_runtime_animation_diagnostics_v02.py

      - name: Commit diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git add tests/test_human_warrior_runtime_animation_v02.gd
          if git diff --cached --quiet; then
            echo "Diagnostics patch is already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: диагностировать post-attack visual state"
          git push origin HEAD:feature/human-warrior-runtime-animation-v02
