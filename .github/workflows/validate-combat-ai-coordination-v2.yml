name: Validate Combat AI Coordination v2

on:
  pull_request:
    paths:
      - 'scripts/systems/squad_tactical_plan_system.gd'
      - 'data/ai/squad_tactical_plans.json'
      - 'scripts/game/game_combat_ai_coordination_v2_runtime.gd'
      - 'scripts/game/game_ai_stealth_v2_ui_runtime.gd'
      - 'tests/test_squad_tactical_replanning_v2.gd'
      - 'tests/smoke_combat_ai_coordination_v2.gd'
      - '.github/workflows/validate-combat-ai-coordination-v2.yml'
      - 'docs/COMBAT_AI_COORDINATION_V2.md'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Godot 4.7.1 Standard
        shell: bash
        run: |
          curl --location --fail --retry 3 --output godot.zip "https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Import project and reject parser errors
        shell: bash
        run: |
          rm -rf .godot
          set -o pipefail
          timeout 180s ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE" --quit 2>&1 | tee combat-ai-coordination-v2-import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" combat-ai-coordination-v2-import.log; then exit 1; fi

      - name: Test squad tactical replanning v2
        shell: bash
        run: timeout 120s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/test_squad_tactical_replanning_v2.gd

      - name: Smoke test Combat AI Coordination v2
        shell: bash
        run: timeout 120s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_combat_ai_coordination_v2.gd

      - name: Regression test Combat AI Coordination v1
        shell: bash
        run: timeout 120s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_combat_ai_coordination_v1.gd

      - name: Regression test Advanced Party Tactics v1
        shell: bash
        run: timeout 120s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_advanced_party_tactics_v1.gd

      - name: Regression test Combat AI Targeting v3
        shell: bash
        run: timeout 120s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_combat_ai_targeting_v3.gd

      - name: Regression test Advanced Combat AI
        shell: bash
        run: timeout 120s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_advanced_combat_ai_runtime.gd

      - name: Regression test squad tactical plans
        shell: bash
        run: timeout 120s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_squad_tactical_plans_runtime.gd

      - name: Regression test AI and Stealth v2
        shell: bash
        run: timeout 120s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_ai_stealth_v2_runtime.gd

      - name: Regression test controllable ally
        shell: bash
        run: timeout 120s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_controllable_ally_runtime.gd

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combat-ai-coordination-v2-diagnostics
          path: combat-ai-coordination-v2-import.log
          if-no-files-found: ignore
          retention-days: 7