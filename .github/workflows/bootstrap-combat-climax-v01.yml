name: Bootstrap combat climax v01

on:
  push:
    branches:
      - feature/combat-climax-v01
    paths:
      - ".github/workflows/bootstrap-combat-climax-v01.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-combat-climax-v01
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/combat-climax-v01
          fetch-depth: 0
      - name: Reassemble and expand source bundle
        run: |
          # Transport revision 04: all eight UTF-8 chunks are Git-blob verified.
          cat tools/audio/combat_climax_v01_source_bundle.part* > /tmp/combat-climax.b64
          base64 --decode /tmp/combat-climax.b64 > /tmp/combat-climax.tar.gz
          echo "bf6f3292bdf5ec1fb52f512a787d0e4a83904532b9c7a7470b05513cdfda1719  /tmp/combat-climax.tar.gz" | sha256sum --check -
          tar -xzf /tmp/combat-climax.tar.gz
      - name: Install pinned audio toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          python -m pip install --disable-pip-version-check --upgrade "numpy==2.3.5"
      - name: Render exact Linux master
        run: |
          python -m py_compile tools/audio/generate_combat_climax_v01.py
          python tools/audio/generate_combat_climax_v01.py \
            --score assets/audio/music/source/combat_climax_v01_score.json \
            --output build/audio/combat_climax_v01
          cp build/audio/combat_climax_v01/combat_climax_v01_master.ogg \
            assets/audio/music/exports/combat_climax_v01_master.ogg
          cp build/audio/combat_climax_v01/combat_climax_v01_master_manifest.json \
            assets/audio/music/source/combat_climax_v01_master_manifest.json
      - name: Validate generated implementation
        run: |
          python tests/test_combat_climax_v01.py
          python tests/test_music_system_foundation.py
      - name: Commit implementation and exact master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/audio/combat_climax_v01_source_bundle.part*
          git add -A
          git add -f assets/audio/music/exports/combat_climax_v01_master.ogg
          git commit -m "feat(audio): добавить кульминационную боевую тему v01"
          git push origin HEAD:feature/combat-climax-v01
      - name: Upload listening artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combat-climax-v01-bootstrap-preview
          path: |
            build/audio/combat_climax_v01/
          if-no-files-found: ignore
          retention-days: 14
