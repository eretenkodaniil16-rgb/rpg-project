name: Validate exploration tension v01

on:
  pull_request:
    paths:
      - "tools/audio/tension_rev02_bundle.b64"
      - ".github/workflows/validate-exploration-tension-v01.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exploration-tension-v01-bootstrap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  publish-approved-revision:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Install pinned audio toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          python -m pip install --disable-pip-version-check --upgrade "numpy==2.3.5"

      - name: Expand approved revision sources
        run: |
          file tools/audio/tension_rev02_bundle.b64
          tar -tzf tools/audio/tension_rev02_bundle.b64
          tar -xzf tools/audio/tension_rev02_bundle.b64

      - name: Render exact Linux game master
        run: |
          python -m py_compile tools/audio/generate_exploration_tension_v01.py
          python tools/audio/generate_exploration_tension_v01.py \
            --score assets/audio/music/source/exploration_tension_v01_score.json \
            --output build/audio/exploration_tension_v01
          cp build/audio/exploration_tension_v01/exploration_tension_v01_master.ogg \
            assets/audio/music/exports/exploration_tension_v01_master.ogg
          cp build/audio/exploration_tension_v01/exploration_tension_v01_master_manifest.json \
            assets/audio/music/source/exploration_tension_v01_master_manifest.json

      - name: Validate revision contracts before publishing
        run: |
          python tests/test_exploration_tension_v01.py
          python tests/test_music_system_foundation.py

      - name: Commit approved audio revision
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          rm tools/audio/tension_rev02_bundle.b64
          rm tools/audio/validate-exploration-tension-v01.final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio/music/source/exploration_tension_v01_score.json
          git add assets/audio/music/source/exploration_tension_v01_provenance.json
          git add assets/audio/music/source/exploration_tension_v01_master_manifest.json
          git add data/audio/music_catalog.json
          git add docs/EXPLORATION_TENSION_V01.md
          git add tests/test_exploration_tension_v01.py
          git add tools/audio/generate_exploration_tension_v01.py
          git add -f assets/audio/music/exports/exploration_tension_v01_master.ogg
          git add -u tools/audio/tension_rev02_bundle.b64
          git commit -m "feat(audio): утвердить более опасный tension master"
          git push origin "HEAD:${HEAD_BRANCH}"

      - name: Upload approved listening artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exploration-tension-v01-revision-02-preview
          path: build/audio/exploration_tension_v01/
          if-no-files-found: ignore
          retention-days: 14
