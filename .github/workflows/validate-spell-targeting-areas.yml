name: Validate spell targeting areas

on:
  pull_request:
    paths:
      - "data/abilities/abilities.json"
      - "data/classes/classes.json"
      - "scripts/systems/spell_area_system.gd"
      - "scripts/systems/class_ability_system.gd"
      - "scripts/systems/spellcasting_system.gd"
      - "scripts/game/battle_grid.gd"
      - "scripts/game/game_srd_combat.gd"
      - "tests/test_spell_targeting_areas.gd"
      - "tests/smoke_spell_area_targeting_ui.gd"
  push:
    branches:
      - feature/spell-targeting-areas
    paths:
      - "data/abilities/abilities.json"
      - "data/classes/classes.json"
      - "scripts/systems/spell_area_system.gd"
      - "scripts/systems/class_ability_system.gd"
      - "scripts/systems/spellcasting_system.gd"
      - "scripts/game/battle_grid.gd"
      - "scripts/game/game_srd_combat.gd"
      - "tests/test_spell_targeting_areas.gd"
      - "tests/smoke_spell_area_targeting_ui.gd"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Godot 4.7.1 Standard
        shell: bash
        run: |
          curl --location --fail --retry 3 --output godot.zip "https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.1"
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Import project
        shell: bash
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE" --quit

      - name: Validate previous spellcasting layer
        shell: bash
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/test_spellcasting_progression_components.gd

      - name: Validate area geometry and multi-target resolution
        shell: bash
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/test_spell_targeting_areas.gd

      - name: Smoke test area targeting UI
        shell: bash
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_spell_area_targeting_ui.gd
