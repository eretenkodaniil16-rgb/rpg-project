name: Render Blender heart ECG minute v09

on:
  workflow_dispatch:
  push:
    branches:
      - tools/blender-heart-ecg-minute-v09
    paths:
      - ".github/heart-cycle-ecg-minute-v09-request.json"

permissions:
  contents: read

concurrency:
  group: blender-heart-ecg-minute-v09-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-shards:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: 1,  start: 1,    end: 120 }
          - { id: 2,  start: 121,  end: 240 }
          - { id: 3,  start: 241,  end: 360 }
          - { id: 4,  start: 361,  end: 480 }
          - { id: 5,  start: 481,  end: 600 }
          - { id: 6,  start: 601,  end: 720 }
          - { id: 7,  start: 721,  end: 840 }
          - { id: 8,  start: 841,  end: 960 }
          - { id: 9,  start: 961,  end: 1080 }
          - { id: 10, start: 1081, end: 1200 }
          - { id: 11, start: 1201, end: 1320 }
          - { id: 12, start: 1321, end: 1440 }
          - { id: 13, start: 1441, end: 1560 }
          - { id: 14, start: 1561, end: 1680 }
          - { id: 15, start: 1681, end: 1800 }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Blender runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1 libxi6 libxrender1 libxkbcommon-x11-0 \
            fonts-dejavu-core ffmpeg

      - name: Download and verify Blender 5.2.0 LTS
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/blender-5.2.0-linux-x64.tar.xz"
          extract="$RUNNER_TEMP/blender-5.2.0"
          curl -L --fail --retry 3 --output "$archive" \
            "https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz"
          actual="$(sha256sum "$archive" | cut -d' ' -f1)"
          expected="96f6c181a30f4950607839dc84d42a354b250d8a0231b098b59b7bc69c351c48"
          test "$actual" = "$expected"
          mkdir -p "$extract"
          tar -xJf "$archive" -C "$extract"
          blender="$(find "$extract" -type f -name blender -perm -111 | head -n 1)"
          test -n "$blender"
          echo "BLENDER_EXE=$blender" >> "$GITHUB_ENV"

      - name: Render 720p15 teaching shard
        shell: bash
        run: |
          set -euo pipefail
          output="$GITHUB_WORKSPACE/artifacts/heart_minute_v09"
          extra=()
          if [[ "${{ matrix.id }}" == "1" ]]; then
            extra+=(--save-blend)
          fi
          xvfb-run -a "$BLENDER_EXE" \
            --background \
            --factory-startup \
            --python-exit-code 1 \
            --python tools/blender_heart_cycle/heart_cycle_ecg_minute_v09.py \
            -- \
            --output-root "$output" \
            --resolution 720 \
            --frame-start "${{ matrix.start }}" \
            --frame-end "${{ matrix.end }}" \
            --sample-step 2 \
            --render-samples 64 \
            --render-animation \
            "${extra[@]}" 2>&1 | tee "heart_minute_v09_shard_${{ matrix.id }}.log"

      - name: Verify shard PNGs
        shell: bash
        run: |
          set -euo pipefail
          root="artifacts/heart_minute_v09/minute_frames"
          count="$(find "$root" -maxdepth 1 -type f -name 'heart_cycle_ecg_*.png' | wc -l)"
          test "$count" -eq 60
          test -s "artifacts/heart_minute_v09/heart_cycle_ecg_minute_v09_manifest.json"
          if [[ "${{ matrix.id }}" == "1" ]]; then
            test -s "artifacts/heart_minute_v09/heart_cutaway_reference_layout_v05_phase_rig_v03_infographic_v04_presentation_v06_animation_v07_ecg_minute_v09.blend"
          fi

      - name: Upload shard
        uses: actions/upload-artifact@v4
        with:
          name: heart-minute-v09-shard-${{ matrix.id }}
          path: |
            artifacts/heart_minute_v09/**
            heart_minute_v09_shard_${{ matrix.id }}.log
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  assemble-review:
    needs: render-shards
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Download all rendered shards
        uses: actions/download-artifact@v4
        with:
          pattern: heart-minute-v09-shard-*
          path: artifacts/merged
          merge-multiple: true

      - name: Assemble 60-second 720p15 review MP4
        shell: bash
        run: |
          set -euo pipefail
          root="artifacts/merged/artifacts/heart_minute_v09"
          frames="$root/minute_frames"
          delivery="artifacts/heart_minute_v09_delivery"
          mkdir -p "$delivery"

          count="$(find "$frames" -maxdepth 1 -type f -name 'heart_cycle_ecg_*.png' | wc -l)"
          test "$count" -eq 900

          ffmpeg -y \
            -framerate 15 \
            -pattern_type glob \
            -i "$frames/heart_cycle_ecg_*.png" \
            -f lavfi -i anullsrc=channel_layout=stereo:sample_rate=48000 \
            -t 60 \
            -vf "setsar=1,format=yuv420p" \
            -c:v libx264 -preset slow -crf 16 -profile:v high \
            -c:a aac -b:a 128k -shortest -movflags +faststart \
            "$delivery/heart_cycle_ecg_minute_v09_720p15_review.mp4"

          ffmpeg -y \
            -ss 00:00:30 \
            -i "$delivery/heart_cycle_ecg_minute_v09_720p15_review.mp4" \
            -frames:v 1 \
            "$delivery/heart_cycle_ecg_minute_v09_poster.png"

          cp "$root/heart_cutaway_reference_layout_v05_phase_rig_v03_infographic_v04_presentation_v06_animation_v07_ecg_minute_v09.blend" "$delivery/"
          cp "$root/heart_cycle_ecg_minute_v09_manifest.json" "$delivery/heart_cycle_ecg_minute_v09_source_manifest.json"

      - name: Verify final review
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          root = Path("artifacts/heart_minute_v09_delivery")
          video = root / "heart_cycle_ecg_minute_v09_720p15_review.mp4"
          poster = root / "heart_cycle_ecg_minute_v09_poster.png"
          blend = root / "heart_cutaway_reference_layout_v05_phase_rig_v03_infographic_v04_presentation_v06_animation_v07_ecg_minute_v09.blend"
          for path in (video, poster, blend):
              assert path.is_file() and path.stat().st_size > 0, path

          probe = json.loads(subprocess.check_output([
              "ffprobe", "-v", "error", "-count_frames", "-select_streams", "v:0",
              "-show_entries", "stream=width,height,nb_read_frames,r_frame_rate,pix_fmt",
              "-show_entries", "format=duration", "-of", "json", str(video)
          ], text=True))
          stream = probe["streams"][0]
          duration = float(probe["format"]["duration"])
          assert stream["width"] == 1280
          assert stream["height"] == 720
          assert stream["r_frame_rate"] == "15/1"
          assert stream["pix_fmt"] == "yuv420p"
          assert int(stream["nb_read_frames"]) == 900
          assert 59.8 <= duration <= 60.2

          delivery = {
              "revision": "heart_cycle_ecg_minute_v09",
              "status": "review_render_verified",
              "width": 1280,
              "height": 720,
              "fps": 15,
              "frame_count": 900,
              "duration_seconds": duration,
              "video": video.name,
              "poster": poster.name,
              "blend": blend.name,
              "source_is_native_blender_render": True,
              "upscaled": False,
          }
          (root / "heart_cycle_ecg_minute_v09_delivery.json").write_text(
              json.dumps(delivery, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          PY

      - name: Upload assembled review
        uses: actions/upload-artifact@v4
        with:
          name: heart-cycle-ecg-minute-v09-review-${{ github.run_id }}
          path: artifacts/heart_minute_v09_delivery/**
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
