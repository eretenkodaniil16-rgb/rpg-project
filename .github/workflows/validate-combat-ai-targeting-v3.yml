name: Validate Combat AI Targeting v3

on:
  pull_request:
    paths:
      - 'scripts/systems/combat_ai_party_target_adapter.gd'
      - 'scripts/game/game_combat_ai_targeting_v3_runtime.gd'
      - 'scripts/game/game_ai_stealth_v2_ui_runtime.gd'
      - 'tests/compile_combat_ai_targeting_v3.gd'
      - 'tests/test_combat_ai_party_target_adapter.gd'
      - 'tests/smoke_combat_ai_targeting_v3.gd'
      - '.github/workflows/validate-combat-ai-targeting-v3.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Godot 4.7.1 Standard
        shell: bash
        run: |
          curl --location --fail --retry 3 --output godot.zip "https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Import project and reject parser errors
        shell: bash
        run: |
          rm -rf .godot
          set -o pipefail
          timeout 180s ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE" --quit 2>&1 | tee combat-ai-targeting-v3-import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" combat-ai-targeting-v3-import.log; then exit 1; fi

      - name: Direct compile targeting v3 runtime
        shell: bash
        run: timeout 60s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/compile_combat_ai_targeting_v3.gd

      - name: Test party target adapter
        shell: bash
        run: timeout 60s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/test_combat_ai_party_target_adapter.gd

      - name: Smoke test actor-agnostic combat targeting
        shell: bash
        run: timeout 120s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_combat_ai_targeting_v3.gd

      - name: Regression test AI and stealth v2 runtime
        shell: bash
        run: timeout 90s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_ai_stealth_v2_runtime.gd

      - name: Regression test advanced combat AI
        shell: bash
        run: timeout 90s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_advanced_combat_ai_runtime.gd

      - name: Regression test controllable ally
        shell: bash
        run: timeout 120s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_controllable_ally_runtime.gd

      - name: Regression test squad tactical plans
        shell: bash
        run: timeout 120s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_squad_tactical_plans_runtime.gd

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combat-ai-targeting-v3-diagnostics
          path: combat-ai-targeting-v3-import.log
          if-no-files-found: ignore
          retention-days: 7
