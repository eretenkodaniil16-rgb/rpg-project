name: Apply spellcasting production context patch

on:
  push:
    branches:
      - feature/spellcasting-progression-components
    paths:
      - ".github/patch_triggers/spellcasting_production_context_patch.txt"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/spellcasting-progression-components
          fetch-depth: 0

      - name: Apply deterministic patch
        run: python tools/maintenance/apply_spellcasting_production_context_patch.py

      - name: Commit patched files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/classes/classes.json data/items/items.json scripts/systems/turn_based_combat_system.gd scripts/systems/class_data_system.gd scripts/systems/spellcasting_system.gd scripts/systems/class_ability_system.gd scripts/game/game_srd_combat.gd scripts/ui/character_hub.gd tests/test_spellcasting_progression_components.gd
          git commit -m "fix: wire production casting context and slot accounting"
          git push origin HEAD:feature/spellcasting-progression-components
