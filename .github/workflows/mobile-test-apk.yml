name: Mobile Test APK

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-test-apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.1"
  GODOT_BINARY: Godot_v4.7.1-stable_linux.x86_64
  APK_PATH: build/android/rpg-project-test-debug.apk

jobs:
  build-apk:
    name: Build downloadable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout requested game version
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "build-tools;35.0.1" \
            "platforms;android-35" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"

      - name: Install Godot and Android export templates
        shell: bash
        run: |
          curl --location --fail --retry 3 \
            --output godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x "$GODOT_BINARY"

          curl --location --fail --retry 3 \
            --output export_templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          rm -rf /tmp/godot-export-templates
          mkdir -p /tmp/godot-export-templates
          unzip -q export_templates.tpz -d /tmp/godot-export-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cp -a /tmp/godot-export-templates/templates/. \
            "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Create temporary debug signing key
        shell: bash
        run: |
          keytool -genkeypair \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=RPG Project,C=NL"

      - name: Configure Godot Android paths
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF_SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$GITHUB_WORKSPACE/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF_SETTINGS

      - name: Clean import and reject GDScript parse errors
        shell: bash
        run: |
          mkdir -p build/android
          rm -rf .godot
          set -o pipefail
          ./$GODOT_BINARY --headless --path "$GITHUB_WORKSPACE" --import \
            2>&1 | tee build/android/import.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script" build/android/import.log; then
            echo "GDScript import errors detected."
            exit 1
          fi

      - name: Export signed Android debug APK
        shell: bash
        run: |
          set -o pipefail
          ./$GODOT_BINARY --headless --path "$GITHUB_WORKSPACE" \
            --export-debug "Android" "$GITHUB_WORKSPACE/$APK_PATH" \
            2>&1 | tee build/android/export.log
          test -s "$APK_PATH"
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify \
            --verbose --print-certs "$APK_PATH"

      - name: Upload APK for phone testing
        uses: actions/upload-artifact@v4
        with:
          name: rpg-project-test-apk-${{ github.run_number }}
          path: build/android/rpg-project-test-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics when build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rpg-project-build-logs-${{ github.run_number }}
          path: |
            build/android/import.log
            build/android/export.log
          if-no-files-found: ignore
          retention-days: 14
