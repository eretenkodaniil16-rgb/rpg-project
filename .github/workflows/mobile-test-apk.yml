name: Mobile Test APK

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-test-apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.1"
  GODOT_BINARY: Godot_v4.7.1-stable_linux.x86_64
  APK_PATH: build/android/rpg-project-test-debug.apk
  TEST_PACKAGE_ID: com.eretenkodaniil.rpgproject.test
  TEST_KEYSTORE_PATH: tools/android/test_signing/rpg-project-test.keystore
  TEST_KEY_ALIAS: rpgtest
  TEST_KEY_PASSWORD: rpg-test-update
  TEST_CERT_SHA256: 9D:63:FF:8D:41:3F:1B:FE:D5:78:A7:48:1F:32:6A:BD:9F:F5:3B:A6:24:E0:A7:E9:26:DF:43:93:C2:7B:8A:48

jobs:
  build-apk:
    name: Build downloadable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout requested game version
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "build-tools;35.0.1" \
            "platforms;android-35" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"

      - name: Install Godot and Android export templates
        shell: bash
        run: |
          curl --location --fail --retry 3 \
            --output godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x "$GODOT_BINARY"

          curl --location --fail --retry 3 \
            --output export_templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          rm -rf /tmp/godot-export-templates
          mkdir -p /tmp/godot-export-templates
          unzip -q export_templates.tpz -d /tmp/godot-export-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cp -a /tmp/godot-export-templates/templates/. \
            "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Restore persistent test signing key
        shell: bash
        run: |
          base64 --decode \
            tools/android/test_signing/rpg-project-test.keystore.b64 \
            > "$TEST_KEYSTORE_PATH"
          chmod 600 "$TEST_KEYSTORE_PATH"
          keytool -list -v \
            -keystore "$TEST_KEYSTORE_PATH" \
            -storepass "$TEST_KEY_PASSWORD" \
            -alias "$TEST_KEY_ALIAS" \
            | tee build-test-key.log
          grep -F "SHA256: $TEST_CERT_SHA256" build-test-key.log

      - name: Configure updateable test application identity
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("export_presets.cfg")
          text = path.read_text(encoding="utf-8")
          run_number = int(os.environ["GITHUB_RUN_NUMBER"])
          version_code = 100000 + run_number
          version_name = f"0.17.0-test.{run_number}"
          package_id = os.environ["TEST_PACKAGE_ID"]

          replacements = (
              (r'version/code=\d+', f'version/code={version_code}'),
              (r'version/name="[^"]*"', f'version/name="{version_name}"'),
              (r'package/unique_name="[^"]*"', f'package/unique_name="{package_id}"'),
              (r'package/name="[^"]*"', 'package/name="Хроники странника — тест"'),
          )
          for pattern, replacement in replacements:
              text, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f"Could not replace export setting: {pattern}")

          path.write_text(text, encoding="utf-8")
          Path("build/android").mkdir(parents=True, exist_ok=True)
          Path("build/android/build-info.txt").write_text(
              "\n".join(
                  (
                      f"package_id={package_id}",
                      f"version_code={version_code}",
                      f"version_name={version_name}",
                      f"certificate_sha256={os.environ['TEST_CERT_SHA256']}",
                      f"git_sha={os.environ['GITHUB_SHA']}",
                      "signing_profile=persistent-public-test-key",
                      "release_key=false",
                  )
              ) + "\n",
              encoding="utf-8",
          )
          PY
          cat build/android/build-info.txt

      - name: Configure Godot Android paths
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF_SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$GITHUB_WORKSPACE/$TEST_KEYSTORE_PATH"
          export/android/debug_keystore_user = "$TEST_KEY_ALIAS"
          export/android/debug_keystore_pass = "$TEST_KEY_PASSWORD"
          EOF_SETTINGS

      - name: Clean import and reject GDScript parse errors
        shell: bash
        run: |
          mkdir -p build/android
          rm -rf .godot
          set -o pipefail
          ./$GODOT_BINARY --headless --path "$GITHUB_WORKSPACE" --import \
            2>&1 | tee build/android/import.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script" build/android/import.log; then
            echo "GDScript import errors detected."
            exit 1
          fi

      - name: Validate mobile combat, progression and HUD
        shell: bash
        run: |
          set -o pipefail
          timeout 90s ./$GODOT_BINARY --headless --path "$GITHUB_WORKSPACE" \
            res://tests/test_mobile_combat_progression_hud.tscn \
            2>&1 | tee build/android/mobile-regression-test.log

      - name: Export updateable signed Android test APK
        shell: bash
        run: |
          set -o pipefail
          ./$GODOT_BINARY --headless --path "$GITHUB_WORKSPACE" \
            --export-debug "Android" "$GITHUB_WORKSPACE/$APK_PATH" \
            2>&1 | tee build/android/export.log
          test -s "$APK_PATH"

          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify \
            --verbose --print-certs "$APK_PATH" \
            | tee build/android/signature-verification.log
          expected_digest="$(printf '%s' "$TEST_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          grep -Fi "Signer #1 certificate SHA-256 digest: $expected_digest" \
            build/android/signature-verification.log

          "$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging "$APK_PATH" \
            | tee build/android/apk-badging.log
          grep -F "package: name='$TEST_PACKAGE_ID'" build/android/apk-badging.log
          grep -F "versionCode='$(awk -F= '/version_code/{print $2}' build/android/build-info.txt)'" \
            build/android/apk-badging.log

      - name: Upload APK for phone testing
        uses: actions/upload-artifact@v4
        with:
          name: rpg-project-updateable-test-apk-${{ github.run_number }}
          path: |
            build/android/rpg-project-test-debug.apk
            build/android/build-info.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics when build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rpg-project-build-logs-${{ github.run_number }}
          path: |
            build-test-key.log
            build/android/build-info.txt
            build/android/import.log
            build/android/mobile-regression-test.log
            build/android/export.log
            build/android/signature-verification.log
            build/android/apk-badging.log
          if-no-files-found: ignore
          retention-days: 14
