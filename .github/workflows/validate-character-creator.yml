name: Validate character creator

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-character-creator:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Godot 4.7.1 Standard
        shell: bash
        run: |
          curl --location --fail --retry 3 --output godot.zip "https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.1"
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Import project
        shell: bash
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE" --quit

      - name: Validate Russian visible text
        shell: bash
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/test_russian_visible_text.gd

      - name: Validate racial ability bonuses
        shell: bash
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/test_racial_ability_bonuses.gd

      - name: Validate press-and-drag scrolling
        shell: bash
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/test_touch_scroll_manager.gd

      - name: Validate visible creator interface
        id: creator
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build/creator"
          set +e
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_character_creator.gd 2>&1 | tee "$GITHUB_WORKSPACE/build/creator/creator.log"
          creator_status=${PIPESTATUS[0]}
          echo "$creator_status" > "$GITHUB_WORKSPACE/build/creator/status.txt"
          exit "$creator_status"

      - name: Upload creator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: character-creator-diagnostics
          path: build/creator/
          if-no-files-found: error
          retention-days: 7

      - name: Fail when creator validation failed
        if: steps.creator.outcome != 'success'
        shell: bash
        run: exit 1
