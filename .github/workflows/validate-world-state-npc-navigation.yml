name: Validate world state and NPC navigation

on:
  pull_request:
    paths:
      - "project.godot"
      - "scenes/game/game.tscn"
      - "scripts/core/game_state_world_snapshot.gd"
      - "scripts/game/world_alert_snapshot_synchronizer.gd"
      - "scripts/game/world_snapshot_readiness_guard.gd"
      - "scripts/game/world_state_npc_navigation_controller.gd"
      - "scripts/game/world_state_npc_navigation_controller_safe.gd"
      - "scripts/game/guard_post_two_room_visibility.gd"
      - "scripts/game/guard_post_wall_visibility_overlay.gd"
      - "scripts/game/game_guard_post_player_feedback_runtime.gd"
      - "scripts/game/player_combat.gd"
      - "scripts/game/player_control_modes.gd"
      - "scripts/game/game_target_free_attacks.gd"
      - "scripts/systems/obstacle_aware_npc_navigation_system.gd"
      - "scripts/ui/mobile_controls.gd"
      - "scripts/ui/mobile_controls_context_actions.gd"
      - "scripts/ui/dialogue_ui.gd"
      - "data/dialogues/caretaker_intro.json"
      - "tests/smoke_world_snapshot_npc_navigation.gd"
      - "tests/smoke_hide_to_exploration_pursuit.gd"
      - "tests/smoke_dialogue_skill_check.gd"
      - "tests/test_v018_integration_stack.gd"
      - ".github/workflows/validate-world-state-npc-navigation.yml"
  push:
    branches:
      - fix/world-state-npc-navigation

concurrency:
  group: world-state-navigation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Godot 4.7.1 Standard
        shell: bash
        run: |
          curl --location --fail --retry 3 --output godot.zip "https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.1"
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Import project and reject parser errors
        shell: bash
        run: |
          rm -rf .godot
          set -o pipefail
          timeout 180s ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE" --quit 2>&1 | tee world-state-import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" world-state-import.log; then
            exit 1
          fi

      - name: Simulate exact world save and safe NPC navigation
        shell: bash
        run: timeout 120s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_world_snapshot_npc_navigation.gd 2>&1 | tee world-state-smoke.log

      - name: Simulate hide suspension and exploration pursuit
        shell: bash
        run: timeout 120s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_hide_to_exploration_pursuit.gd 2>&1 | tee hide-pursuit-smoke.log

      - name: Validate one-shot dialogue checks
        shell: bash
        run: timeout 120s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_dialogue_skill_check.gd 2>&1 | tee dialogue-check-smoke.log

      - name: Validate integration stack and save version
        shell: bash
        run: timeout 180s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/test_v018_integration_stack.gd 2>&1 | tee integration-stack.log

      - name: Regression test field of view and save menus
        shell: bash
        run: timeout 180s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_player_visibility_save_runtime.gd 2>&1 | tee visibility-save-regression.log

      - name: Regression test wall integrity
        shell: bash
        run: timeout 180s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_movement_wall_integrity.gd 2>&1 | tee wall-integrity-regression.log

      - name: Regression test target-free attacks
        shell: bash
        run: timeout 180s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_free_aim_combat.gd 2>&1 | tee free-aim-regression.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-state-npc-navigation-diagnostics
          path: |
            world-state-import.log
            world-state-smoke.log
            hide-pursuit-smoke.log
            dialogue-check-smoke.log
            integration-stack.log
            visibility-save-regression.log
            wall-integrity-regression.log
            free-aim-regression.log
          retention-days: 7
