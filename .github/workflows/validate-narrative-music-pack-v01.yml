name: Validate narrative music pack v01

on:
  pull_request:
    paths:
      - "assets/audio/music/source/mad_wizard_theme_v01_score.json"
      - "assets/audio/music/source/mad_wizard_theme_v01_provenance.json"
      - "assets/audio/music/source/mad_wizard_theme_v01_master_manifest.json"
      - "assets/audio/music/source/tavern_commonroom_v01_score.json"
      - "assets/audio/music/source/tavern_commonroom_v01_provenance.json"
      - "assets/audio/music/source/tavern_commonroom_v01_master_manifest.json"
      - "assets/audio/music/source/elevator_descent_floor01_v01_score.json"
      - "assets/audio/music/source/elevator_descent_floor01_v01_provenance.json"
      - "assets/audio/music/source/elevator_descent_floor01_v01_master_manifest.json"
      - "assets/audio/music/source/act01_plan_broken_v01_score.json"
      - "assets/audio/music/source/act01_plan_broken_v01_provenance.json"
      - "assets/audio/music/source/act01_plan_broken_v01_master_manifest.json"
      - "assets/audio/music/exports/mad_wizard_theme_v01_master.ogg"
      - "assets/audio/music/exports/tavern_commonroom_v01_master.ogg"
      - "assets/audio/music/exports/elevator_descent_floor01_v01_master.ogg"
      - "assets/audio/music/exports/act01_plan_broken_v01_master.ogg"
      - "data/audio/music_catalog.json"
      - "tools/audio/generate_narrative_music_pack_v01.py"
      - "tools/audio/generate_narrative_music_pack_v02.py"
      - "tests/test_narrative_music_pack_v01.py"
      - "tests/test_narrative_music_pack.gd"
      - "docs/NARRATIVE_MUSIC_PACK_V01.md"
      - ".github/workflows/validate-narrative-music-pack-v01.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: narrative-music-pack-v01-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned audio toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          python -m pip install --disable-pip-version-check --upgrade "numpy==2.3.5"

      - name: Validate static contracts
        run: python tests/test_narrative_music_pack_v01.py

      - name: Render independent candidates
        run: |
          set -euo pipefail
          python -m py_compile tools/audio/generate_narrative_music_pack_v01.py
          python -m py_compile tools/audio/generate_narrative_music_pack_v02.py
          for cid in mad_wizard_theme_v01 tavern_commonroom_v01
          do
            python tools/audio/generate_narrative_music_pack_v01.py \
              --score "assets/audio/music/source/${cid}_score.json" \
              --output "build/audio/narrative_music_pack_v01/${cid}"
          done
          for cid in elevator_descent_floor01_v01 act01_plan_broken_v01
          do
            python tools/audio/generate_narrative_music_pack_v02.py \
              --score "assets/audio/music/source/${cid}_score.json" \
              --output "build/audio/narrative_music_pack_v01/${cid}"
          done

      - name: Compare deterministic PCM contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path(".")
          cids = ["mad_wizard_theme_v01", "tavern_commonroom_v01", "elevator_descent_floor01_v01", "act01_plan_broken_v01"]
          keys = (
              "composition_id", "score_sha256", "renderer", "arrangement_revision", "numpy_version",
              "sample_rate", "channels", "duration_seconds", "tempo_bpm", "time_signature", "bars", "loop",
              "pcm_signature_shift_bits", "pcm_signature_sha256", "peak_dbfs", "rms_dbfs",
              "boundary_value_delta", "boundary_slope_delta", "midi_sha256",
          )
          for cid in cids:
              expected = json.loads((root / f"assets/audio/music/source/{cid}_master_manifest.json").read_text())
              rendered = json.loads((root / f"build/audio/narrative_music_pack_v01/{cid}/{cid}_master_manifest.json").read_text())
              for key in keys:
                  assert rendered[key] == expected[key], (cid, key, rendered[key], expected[key])
          print("Narrative music deterministic PCM contracts passed.")
          PY

      - name: Download Godot 4.7.1 Standard
        run: |
          curl --location --fail --retry 4 --retry-all-errors --retry-delay 3 \
            --connect-timeout 20 --max-time 180 --output godot.zip \
            "https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.1"
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Import project and reject parser errors
        run: |
          rm -rf .godot
          set -o pipefail
          timeout 180s ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor \
            --path "$GITHUB_WORKSPACE" --quit 2>&1 | tee narrative-music-import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" narrative-music-import.log; then exit 1; fi

      - name: Test narrative playback contexts
        run: |
          set -o pipefail
          timeout 120s ./Godot_v4.7.1-stable_linux.x86_64 --headless \
            --path "$GITHUB_WORKSPACE" --script res://tests/test_narrative_music_pack.gd \
            2>&1 | tee narrative-music-runtime.log
          grep -F "Narrative music pack v01 runtime tests passed." narrative-music-runtime.log

      - name: Recheck shared music system
        run: python tests/test_music_system_foundation.py

      - name: Upload listening pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: narrative-music-pack-v01-preview
          path: |
            build/audio/narrative_music_pack_v01/*/*_preview.mp3
            build/audio/narrative_music_pack_v01/*/*.mid
            build/audio/narrative_music_pack_v01/*/*_master_manifest.json
            narrative-music-*.log
          if-no-files-found: ignore
          retention-days: 14
