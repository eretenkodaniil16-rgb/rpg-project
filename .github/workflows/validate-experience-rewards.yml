name: Validate experience rewards

on:
  pull_request:
    paths:
      - "data/rewards/experience_rewards.json"
      - "data/quests/quests.json"
      - "data/dialogues/caretaker_intro.json"
      - "project.godot"
      - "scripts/core/game_state_rewards.gd"
      - "scripts/systems/experience_reward_system.gd"
      - "scripts/systems/progression_system.gd"
      - "scripts/game/training_dummy.gd"
      - "scripts/game/game_feature_ui.gd"
      - "scripts/ui/dialogue_ui_base.gd"
      - "scripts/ui/experience_reward_toast.gd"
      - "scripts/ui/character_hub_level_up.gd"
      - "tests/test_experience_reward_system.gd"
      - "tests/test_quest_inventory.gd"
      - "tests/smoke_dialogue_skill_check.gd"
      - "tests/smoke_experience_reward_ui.gd"
      - ".github/workflows/validate-experience-rewards.yml"
  push:
    branches:
      - feature/experience-reward-pipeline
    paths:
      - "data/rewards/experience_rewards.json"
      - "data/quests/quests.json"
      - "data/dialogues/caretaker_intro.json"
      - "project.godot"
      - "scripts/core/game_state_rewards.gd"
      - "scripts/systems/experience_reward_system.gd"
      - "scripts/game/training_dummy.gd"
      - "scripts/game/game_feature_ui.gd"
      - "scripts/ui/dialogue_ui_base.gd"
      - "scripts/ui/experience_reward_toast.gd"
      - "scripts/ui/character_hub_level_up.gd"
      - "tests/test_experience_reward_system.gd"
      - "tests/test_quest_inventory.gd"
      - "tests/smoke_dialogue_skill_check.gd"
      - "tests/smoke_experience_reward_ui.gd"
      - ".github/workflows/validate-experience-rewards.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Godot 4.7.1 Standard
        shell: bash
        run: |
          curl --location --fail --retry 3 --output godot.zip "https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.1"
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Import project
        shell: bash
        run: |
          rm -rf .godot
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE" --quit

      - name: Validate reward IDs, quest completion and migration
        shell: bash
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/test_experience_reward_system.gd

      - name: Validate quest and inventory regression
        shell: bash
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/test_quest_inventory.gd

      - name: Smoke test dialogue reward integration
        shell: bash
        run: timeout 120s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_dialogue_skill_check.gd

      - name: Smoke test mobile reward notification and Character Hub
        shell: bash
        run: timeout 120s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_experience_reward_ui.gd
