name: Validate level-up progression

on:
  pull_request:
    paths:
      - "scripts/systems/progression_system.gd"
      - "scripts/systems/level_up_system.gd"
      - "scripts/systems/spell_selection_system.gd"
      - "scripts/systems/spellcasting_progression_system.gd"
      - "scripts/systems/spellcasting_system.gd"
      - "scripts/systems/class_data_system.gd"
      - "scripts/systems/race_data_system.gd"
      - "scripts/ui/level_up_panel.gd"
      - "scripts/ui/character_hub_inventory.gd"
      - "scripts/game/game_feature_ui.gd"
      - "data/classes/classes.json"
      - "data/rules/spell_selection.json"
      - "data/rules/spellcasting_progression.json"
      - "tests/test_level_up_system.gd"
      - "tests/test_mobile_combat_progression_hud.gd"
      - "tests/test_mobile_combat_progression_hud.tscn"
      - ".github/workflows/validate-level-up.yml"
  push:
    branches:
      - feature/level-up-progression-v2
    paths:
      - "scripts/systems/progression_system.gd"
      - "scripts/systems/level_up_system.gd"
      - "scripts/ui/level_up_panel.gd"
      - "scripts/ui/character_hub_inventory.gd"
      - "scripts/game/game_feature_ui.gd"
      - "tests/test_level_up_system.gd"
      - "tests/test_mobile_combat_progression_hud.gd"
      - ".github/workflows/validate-level-up.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Godot 4.7.1 Standard
        shell: bash
        run: |
          curl --location --fail --retry 3 --output godot.zip "https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.1"
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Import project
        shell: bash
        run: |
          rm -rf .godot
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE" --quit

      - name: Validate official XP and saved level-up transactions
        shell: bash
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/test_level_up_system.gd

      - name: Validate mobile level-up integration and HUD
        shell: bash
        run: timeout 120s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" res://tests/test_mobile_combat_progression_hud.tscn
