name: Validate AI and stealth v2

on:
  pull_request:
    paths:
      - 'scripts/game/game_ai_stealth_v2_runtime.gd'
      - 'scripts/systems/exploration_stealth_perception_system.gd'
      - 'scripts/systems/npc_tactical_targeting_system.gd'
      - 'data/ai/stealth_perception_v2.json'
      - 'data/ai/npc_tactical_targeting_v2.json'
      - 'scenes/game/game.tscn'
      - 'tests/test_ai_perception_and_targeting_v2.gd'
      - 'tests/smoke_ai_stealth_v2_runtime.gd'
      - '.github/workflows/validate-ai-stealth-v2.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download Godot 4.7.1 Standard
        shell: bash
        run: |
          curl --location --fail --retry 3 --output godot.zip "https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64
      - name: Import project and reject parser errors
        shell: bash
        run: |
          rm -rf .godot
          set -o pipefail
          timeout 180s ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE" --quit 2>&1 | tee ai-stealth-v2-import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" ai-stealth-v2-import.log; then exit 1; fi
      - name: Test perception and tactical targeting policy
        shell: bash
        run: |
          timeout 60s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/test_ai_perception_and_targeting_v2.gd
      - name: Smoke test integrated AI and stealth runtime
        shell: bash
        run: |
          timeout 60s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_ai_stealth_v2_runtime.gd
      - name: Regression test exploration stealth
        shell: bash
        run: |
          timeout 60s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_exploration_stealth_alerts.gd
      - name: Regression test advanced combat AI
        shell: bash
        run: |
          timeout 60s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_advanced_combat_ai_runtime.gd
      - name: Regression test squad tactical plans
        shell: bash
        run: |
          timeout 60s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_squad_tactical_plans.gd
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-stealth-v2-diagnostics
          path: ai-stealth-v2-import.log
          if-no-files-found: ignore
          retention-days: 7
