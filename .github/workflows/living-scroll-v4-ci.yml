name: Living Scroll V4 — Blender model pass CI

on:
  push:
    branches:
      - art/living-scroll-v4-model-pass
    paths:
      - 'living_scroll_v4/**'
      - '.github/workflows/living-scroll-v4-ci.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Smoke: eight control frames, or full: 12-second MP4'
        type: choice
        options: [smoke, full]
        default: smoke
        required: true

permissions:
  contents: read

concurrency:
  group: living-scroll-v4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  model-pass:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install fixed dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check Pillow==11.3.0 numpy==2.2.6
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb libgl1 libxi6 libxrender1 libxkbcommon-x11-0 libsm6 ffmpeg

      - name: Compile scripts and generate painterly assets
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile living_scroll_v3/generate_assets.py living_scroll_v3/blender_scene.py living_scroll_v4/scene.py
          python living_scroll_v3/generate_assets.py
          test -s living_scroll_v3/assets/paper.png
          test -s living_scroll_v3/assets/lotus_focus.png
          test -s living_scroll_v3/assets/landscape_master.png

      - name: Download trusted Blender 5.2.0 LTS build
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/blender-5.2.0-linux-x64.tar.xz"
          curl -fL --retry 3 -o "$archive" https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz
          echo "96f6c181a30f4950607839dc84d42a354b250d8a0231b098b59b7bc69c351c48  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/blender-runtime"
          tar -xJf "$archive" -C "$RUNNER_TEMP/blender-runtime"
          blender="$(find "$RUNNER_TEMP/blender-runtime" -type f -name blender -perm -111 | head -n 1)"
          test -n "$blender"
          echo "BLENDER_EXE=$blender" >> "$GITHUB_ENV"
          xvfb-run -a "$blender" -b --factory-startup --python-exit-code 1 --python-expr 'import bpy; print("Blender:", bpy.app.version_string)'

      - name: Build editable model pass and render
        shell: bash
        env:
          RENDER_MODE: ${{ inputs.mode || 'smoke' }}
        run: |
          set -euo pipefail
          test "$RENDER_MODE" = smoke -o "$RENDER_MODE" = full
          xvfb-run -a "$BLENDER_EXE" -b --factory-startup --python-exit-code 1 --python living_scroll_v4/scene.py -- --$RENDER_MODE 2>&1 | tee blender_v4.log
          test -s living_scroll_v4/living_scroll_v4.blend
          if [ "$RENDER_MODE" = smoke ]; then
            test "$(find living_scroll_v4/renders -name 'smoke_*.png' | wc -l)" -eq 8
          else
            test -s living_scroll_v4/renders/frame_0288.png
            ffmpeg -hide_banner -loglevel error -y -framerate 24 -start_number 1 -i living_scroll_v4/renders/frame_%04d.png -c:v libx264 -pix_fmt yuv420p -crf 19 -movflags +faststart living_scroll_v4/the_living_scroll_v4.mp4
            ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 living_scroll_v4/the_living_scroll_v4.mp4
          fi

      - name: Generate eight-frame preview contact sheet
        if: success()
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path
          paths=sorted(Path("living_scroll_v4/renders").glob("smoke_*.png"))
          if not paths:raise SystemExit("Full render: skip preview sheet")
          width,height=360,640
          sheet=Image.new("RGB",(4*(width+20),2*(height+54)),(238,230,215))
          d=ImageDraw.Draw(sheet)
          for i,p in enumerate(paths):
              im=Image.open(p).convert("RGB")
              x=(i%4)*(width+20)+10;y=(i//4)*(height+54)+12
              sheet.paste(im,(x,y));d.text((x,y+height+8),p.stem,fill=(30,25,23))
          sheet.save("living_scroll_v4/contact_sheet.png",optimize=True)
          PY

      - name: Upload scene, model QA previews and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: living-scroll-v4-model-pass-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            blender_v4.log
            living_scroll_v4/living_scroll_v4.blend
            living_scroll_v4/contact_sheet.png
            living_scroll_v4/renders/smoke_*.png
            living_scroll_v4/the_living_scroll_v4.mp4
          if-no-files-found: warn
          retention-days: 14
