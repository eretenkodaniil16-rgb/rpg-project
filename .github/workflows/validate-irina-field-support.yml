name: Validate Irina field support

on:
  pull_request:
    paths:
      - "scenes/game/game.tscn"
      - "scripts/game/game_party_field_support_runtime.gd"
      - "scripts/game/party_room_fog_overlay.gd"
      - "scripts/game/guard_post_party_visibility.gd"
      - "tests/smoke_irina_field_support.gd"
      - "docs/IRINA_FIELD_SUPPORT_V1.md"
      - ".github/workflows/validate-irina-field-support.yml"
  push:
    branches:
      - fix/irina-field-support-visibility-follow-v1

concurrency:
  group: irina-field-support-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Godot 4.7.1 Standard
        shell: bash
        run: |
          curl --location --fail --retry 3 \
            --output godot.zip \
            "https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Import project and reject parser errors
        shell: bash
        run: |
          rm -rf .godot
          set -o pipefail
          timeout 180s ./Godot_v4.7.1-stable_linux.x86_64 \
            --headless --editor --path "$GITHUB_WORKSPACE" --quit 2>&1 \
            | tee irina-field-support-import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" irina-field-support-import.log; then
            exit 1
          fi

      - name: Simulate field support, visibility and follow
        shell: bash
        run: |
          set +e
          timeout 90s ./Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path "$GITHUB_WORKSPACE" \
            --script res://tests/smoke_irina_field_support.gd 2>&1 \
            | tee irina-field-support-runtime.log
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            while IFS= read -r line; do echo "::error::$line"; done \
              < <(tail -n 240 irina-field-support-runtime.log)
            exit "$result"
          fi

      - name: Regression test existing Medicine and long rest
        shell: bash
        run: |
          timeout 90s ./Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path "$GITHUB_WORKSPACE" \
            --script res://tests/smoke_controllable_ally_medicine_recovery.gd 2>&1 \
            | tee irina-medicine-regression.log

      - name: Regression test party controls
        shell: bash
        run: |
          timeout 90s ./Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path "$GITHUB_WORKSPACE" \
            --script res://tests/smoke_party_menu_exploration_control.gd 2>&1 \
            | tee irina-party-control-regression.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: irina-field-support-diagnostics
          path: |
            irina-field-support-import.log
            irina-field-support-runtime.log
            irina-medicine-regression.log
            irina-party-control-regression.log
          if-no-files-found: warn
          retention-days: 7
