name: Patch attack facing lock v02

on:
  push:
    branches:
      - feature/human-warrior-runtime-animation-v02
    paths:
      - ".github/workflows/patch-attack-facing-lock-v02.yml"
      - "tools/runtime_animation/patch_attack_facing_lock_v02.py"

permissions:
  contents: write

concurrency:
  group: patch-attack-facing-lock-v02-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout runtime branch
        uses: actions/checkout@v4
        with:
          ref: feature/human-warrior-runtime-animation-v02

      - name: Apply attack facing lock patch
        shell: pwsh
        run: python tools/runtime_animation/patch_attack_facing_lock_v02.py

      - name: Commit production fix and test
        shell: pwsh
        run: |
          git add scripts/game/player.gd scripts/game/player_combat.gd tests/test_human_warrior_runtime_animation_v02.gd
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Attack facing lock patch is already applied."
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: фиксировать направление на время sword attack"
          git push origin HEAD:feature/human-warrior-runtime-animation-v02
