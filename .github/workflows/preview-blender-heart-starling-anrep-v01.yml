name: Preview Blender Frank-Starling and Anrep v01 keyframes

on:
  push:
    branches:
      - tools/blender-heart-starling-anrep-v01
    paths:
      - ".github/heart-starling-anrep-v01-preview-request.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-starling-anrep-v01-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: frank_starling_32s, frame: 961 }
          - { name: anrep_78s, frame: 2341 }
          - { name: comparison_96s, frame: 2881 }
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1 libxi6 libxrender1 libxkbcommon-x11-0 fonts-dejavu-core
      - name: Download Blender 5.2.0 LTS
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/blender-5.2.0-linux-x64.tar.xz"
          extract="$RUNNER_TEMP/blender-5.2.0"
          curl -L --fail --retry 3 --output "$archive" "https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz"
          test "$(sha256sum "$archive" | cut -d' ' -f1)" = "96f6c181a30f4950607839dc84d42a354b250d8a0231b098b59b7bc69c351c48"
          mkdir -p "$extract"
          tar -xJf "$archive" -C "$extract"
          blender="$(find "$extract" -type f -name blender -perm -111 | head -n 1)"
          echo "BLENDER_EXE=$blender" >> "$GITHUB_ENV"
      - name: Render keyframe
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/artifacts/${{ matrix.name }}"
          xvfb-run -a "$BLENDER_EXE" \
            --background --factory-startup --python-exit-code 1 \
            --python tools/blender_heart_cycle/heart_starling_anrep_v01_runner.py \
            -- \
            --output-root "$root" \
            --resolution 720 \
            --frame-start "${{ matrix.frame }}" \
            --frame-end "${{ matrix.frame }}" \
            --sample-step 1 \
            --render-samples 32 \
            --render-animation 2>&1 | tee "${{ matrix.name }}.log"
          count="$(find "$root/starling_anrep_frames" -type f -name 'starling_anrep_*.png' | wc -l)"
          test "$count" -eq 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: starling-anrep-v01-preview-${{ matrix.name }}
          path: |
            artifacts/${{ matrix.name }}/**
            ${{ matrix.name }}.log
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
