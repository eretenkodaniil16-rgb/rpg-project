name: Render Blender heart animation

on:
  workflow_dispatch:
  push:
    branches:
      - tools/blender-heart-cycle
    paths:
      - ".github/heart-cycle-animation-request.json"

permissions:
  contents: read

concurrency:
  group: blender-heart-animation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-review-animation:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install render, font and video dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1 libxi6 libxrender1 libxkbcommon-x11-0 \
            fonts-dejavu-core ffmpeg

      - name: Download and verify Blender 5.2.0 LTS
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/blender-5.2.0-linux-x64.tar.xz"
          extract="$RUNNER_TEMP/blender-5.2.0"
          curl -L --fail --retry 3 --output "$archive" \
            "https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz"
          actual="$(sha256sum "$archive" | cut -d' ' -f1)"
          expected="96f6c181a30f4950607839dc84d42a354b250d8a0231b098b59b7bc69c351c48"
          test "$actual" = "$expected"
          mkdir -p "$extract"
          tar -xJf "$archive" -C "$extract"
          blender="$(find "$extract" -type f -name blender -perm -111 | head -n 1)"
          test -n "$blender"
          echo "BLENDER_EXE=$blender" >> "$GITHUB_ENV"

      - name: Render 225-frame review PNG sequence
        id: animation-build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          output="$GITHUB_WORKSPACE/artifacts/blender_heart_cycle_animation"
          xvfb-run -a "$BLENDER_EXE" \
            --background \
            --factory-startup \
            --python-exit-code 1 \
            --python tools/blender_heart_cycle/heart_cycle_animation_export_v07.py \
            -- \
            --output-root "$output" \
            --render-animation \
            --resolution 720 \
            --animation-resolution 360 \
            --sample-step 2 \
            --video-bitrate 4500 2>&1 | tee heart_cycle_animation_blender.log

      - name: Encode MP4, GIF and poster
        if: steps.animation-build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          output="artifacts/blender_heart_cycle_animation"
          frames="$output/review_frames"
          video="$output/heart_cycle_review_v07.mp4"
          palette="$output/heart_cycle_review_v07_palette.png"
          gif="$output/heart_cycle_review_v07.gif"
          poster="$output/heart_cycle_review_v07_poster.png"

          count="$(find "$frames" -maxdepth 1 -type f -name 'heart_cycle_review_*.png' | wc -l)"
          test "$count" -eq 225

          ffmpeg -y \
            -framerate 15 \
            -pattern_type glob \
            -i "$frames/heart_cycle_review_*.png" \
            -c:v libx264 \
            -pix_fmt yuv420p \
            -b:v 4500k \
            -movflags +faststart \
            "$video"

          ffmpeg -y -i "$video" \
            -vf "fps=15,scale=480:-1:flags=lanczos,palettegen=max_colors=128:stats_mode=diff" \
            "$palette"
          ffmpeg -y -i "$video" -i "$palette" \
            -lavfi "fps=15,scale=480:-1:flags=lanczos[x];[x][1:v]paletteuse=dither=bayer:bayer_scale=3" \
            "$gif"
          ffmpeg -y -ss 00:00:07.500 -i "$video" -frames:v 1 "$poster"
          rm -f "$palette"

      - name: Verify video timing and enrich manifest
        if: steps.animation-build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import shutil
          import subprocess
          from pathlib import Path

          root = Path("artifacts/blender_heart_cycle_animation")
          frames = root / "review_frames"
          video = root / "heart_cycle_review_v07.mp4"
          gif = root / "heart_cycle_review_v07.gif"
          poster = root / "heart_cycle_review_v07_poster.png"
          blend = root / (
              "heart_cutaway_reference_layout_v05_phase_rig_v03_"
              "infographic_v04_presentation_v06_animation_v07.blend"
          )
          manifest = root / "heart_cycle_manifest.json"

          rendered_frames = sorted(frames.glob("heart_cycle_review_*.png"))
          assert len(rendered_frames) == 225
          for path in (*rendered_frames, video, gif, poster, blend, manifest):
              assert path.is_file() and path.stat().st_size > 0, path

          probe = json.loads(
              subprocess.check_output(
                  [
                      "ffprobe",
                      "-v", "error",
                      "-count_frames",
                      "-select_streams", "v:0",
                      "-show_entries", "stream=width,height,nb_read_frames,r_frame_rate",
                      "-show_entries", "format=duration",
                      "-of", "json",
                      str(video),
                  ],
                  text=True,
              )
          )
          stream = probe["streams"][0]
          duration = float(probe["format"]["duration"])
          frame_count = int(stream["nb_read_frames"])
          assert stream["width"] == 640
          assert stream["height"] == 360
          assert stream["r_frame_rate"] == "15/1"
          assert frame_count == 225
          assert 14.9 <= duration <= 15.1

          payload = json.loads(manifest.read_text(encoding="utf-8"))
          export = payload["animation_export"]
          assert payload["animation_export_revision"] == "heart_cycle_animation_export_v07"
          assert export["frames_rendered"] is True
          assert export["video_rendered"] is False
          assert export["rendered"] is False
          assert export["review_profile"]["output_frame_count"] == 225
          export["video_rendered"] = True
          export["rendered"] = True
          export["intermediate"]["retained_in_delivery_artifact"] = False
          export["verification"] = {
              "status": "passed",
              "actual_width": stream["width"],
              "actual_height": stream["height"],
              "actual_fps": 15,
              "actual_frame_count": frame_count,
              "actual_duration_seconds": duration,
              "mp4_size_bytes": video.stat().st_size,
              "gif_size_bytes": gif.stat().st_size,
              "poster": poster.name,
          }
          manifest.write_text(
              json.dumps(payload, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          # Delivery keeps the compact video files. If an encoding or
          # verification step fails, this line is not reached and the partial
          # PNG sequence remains available in the failure artifact.
          shutil.rmtree(frames)
          PY

      - name: Upload heart animation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heart_animation_review_v07_${{ github.run_id }}_${{ github.run_attempt }}
          path: |
            artifacts/blender_heart_cycle_animation/**
            heart_cycle_animation_blender.log
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Require successful animation render
        if: steps.animation-build.outcome != 'success'
        run: |
          echo "Heart animation frame render failed; inspect heart_cycle_animation_blender.log in the uploaded artifact."
          exit 1
