name: Validate vault inner watch music phase

on:
  pull_request:
    paths:
      - "data/audio/encounter_music_phase_events.json"
      - "scripts/systems/encounter_music_phase_system.gd"
      - "scripts/game/combat_ai_training_mage.gd"
      - "scripts/game/game_vault_inner_watch_climax_runtime.gd"
      - "scenes/game/game.tscn"
      - "tests/test_encounter_music_phase_system.gd"
      - "tests/test_vault_inner_watch_music_phase.py"
      - "docs/VAULT_INNER_WATCH_MUSIC_PHASE_V01.md"
      - ".github/workflows/validate-vault-inner-watch-music-phase.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vault-inner-watch-music-phase-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate static contracts
        run: |
          python tests/test_vault_inner_watch_music_phase.py
      - name: Download Godot 4.7.1 Standard
        run: |
          curl --location --fail --retry 4 --retry-all-errors --retry-delay 3 \
            --connect-timeout 20 --max-time 180 --output godot.zip \
            "https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.1"
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64
      - name: Import project and reject parser errors
        run: |
          rm -rf .godot
          set -o pipefail
          timeout 180s ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor \
            --path "$GITHUB_WORKSPACE" --quit 2>&1 | tee vault-inner-watch-import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" vault-inner-watch-import.log; then exit 1; fi
      - name: Test encounter phase rules
        run: |
          timeout 90s ./Godot_v4.7.1-stable_linux.x86_64 --headless \
            --path "$GITHUB_WORKSPACE" --script res://tests/test_encounter_music_phase_system.gd \
            2>&1 | tee vault-inner-watch-phase-test.log
          grep -F "Encounter music phase system tests passed." vault-inner-watch-phase-test.log
      - name: Recheck persistent music profile registry
        run: |
          timeout 90s ./Godot_v4.7.1-stable_linux.x86_64 --headless \
            --path "$GITHUB_WORKSPACE" --script res://tests/test_combat_music_profile_registry.gd \
            2>&1 | tee vault-inner-watch-registry-test.log
          grep -F "Combat music profile registry tests passed." vault-inner-watch-registry-test.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vault-inner-watch-music-phase-diagnostics
          path: |
            vault-inner-watch-*.log
          if-no-files-found: ignore
          retention-days: 14
