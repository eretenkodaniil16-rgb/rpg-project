name: Apply squad runtime indentation fix

on:
  push:
    branches:
      - feature/squad-tactical-plans
    paths:
      - ".github/workflows/apply-squad-runtime-codemod.yml"

permissions:
  contents: write

jobs:
  update-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout squad planning branch
        uses: actions/checkout@v4
        with:
          ref: feature/squad-tactical-plans
          fetch-depth: 0

      - name: Repair typed actor-id conversion indentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime = Path("scripts/game/game_squad_tactical_plans_runtime.gd")
          text = runtime.read_text(encoding="utf-8")
          broken = '''\tvar actor_ids: Array[String] = []
          for member_id_value: Variant in squad_context.get("member_ids", []) as Array:
              actor_ids.append(str(member_id_value))'''
          fixed = '''\tvar actor_ids: Array[String] = []
\tfor member_id_value: Variant in squad_context.get("member_ids", []) as Array:
\t\tactor_ids.append(str(member_id_value))'''
          if broken not in text:
              raise SystemExit("Broken indentation marker was not found")
          runtime.write_text(text.replace(broken, fixed), encoding="utf-8")
          PY

      - name: Commit repaired runtime
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/game/game_squad_tactical_plans_runtime.gd
          git commit -m "fix: восстановить отступы squad planning runtime"
          git push origin HEAD:feature/squad-tactical-plans
