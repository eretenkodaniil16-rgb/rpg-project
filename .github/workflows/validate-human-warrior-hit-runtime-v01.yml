name: Validate human warrior hit runtime v01

on:
  pull_request:
    paths:
      - "assets/characters/human/warrior_m01/gameplay/approved/atlases/**"
      - "data/visuals/human_warrior_m01_animation_assets_v01.json"
      - "data/visuals/human_warrior_m01_animation_assets_v01.lock.json"
      - "scripts/game/human_warrior_animation_library.gd"
      - "scripts/game/player.gd"
      - "scripts/game/player_combat.gd"
      - "scripts/game/game_damage_fall_reactions_runtime.gd"
      - "tests/test_human_warrior_animation_assets_v01.py"
      - "tests/test_human_warrior_runtime_animation_v02.gd"
      - "tests/test_human_warrior_hit_runtime_v01.gd"
      - "docs/HUMAN_WARRIOR_HIT_RUNTIME_V01.md"
      - ".github/workflows/validate-human-warrior-hit-runtime-v01.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: human-warrior-hit-runtime-v01-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate approved atlas hashes and contracts
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pillow
          python tests/test_human_warrior_animation_assets_v01.py

      - name: Download Godot 4.7.1 Standard
        shell: bash
        run: |
          set -euo pipefail
          curl \
            --location \
            --fail \
            --retry 4 \
            --retry-all-errors \
            --retry-delay 3 \
            --connect-timeout 20 \
            --max-time 180 \
            --output godot.zip \
            "https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.1"
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Import project and reject parser errors
        shell: bash
        run: |
          rm -rf .godot
          set -o pipefail
          timeout 240s ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE" --quit 2>&1 | tee human-warrior-hit-runtime-import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" human-warrior-hit-runtime-import.log; then
            exit 1
          fi

      - name: Create CI scene wrappers
        shell: bash
        run: |
          cat > tests/__ci_human_warrior_hit_runtime_v01.tscn <<'EOF'
          [gd_scene load_steps=2 format=3]

          [ext_resource type="Script" path="res://tests/test_human_warrior_hit_runtime_v01.gd" id="1_test"]

          [node name="HumanWarriorHitRuntimeV01Test" type="Node"]
          script = ExtResource("1_test")
          EOF
          cat > tests/__ci_human_warrior_runtime_v02.tscn <<'EOF'
          [gd_scene load_steps=2 format=3]

          [ext_resource type="Script" path="res://tests/test_human_warrior_runtime_animation_v02.gd" id="1_test"]

          [node name="HumanWarriorRuntimeV02Test" type="Node"]
          script = ExtResource("1_test")
          EOF
          cat > tests/__ci_damage_fall_reactions_runtime.tscn <<'EOF'
          [gd_scene load_steps=2 format=3]

          [ext_resource type="Script" path="res://tests/smoke_damage_fall_reactions_runtime.gd" id="1_test"]

          [node name="DamageFallReactionsRuntimeTest" type="Node"]
          script = ExtResource("1_test")
          EOF

      - name: Validate hit runtime and production damage trigger
        shell: bash
        run: timeout 360s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" res://tests/__ci_human_warrior_hit_runtime_v01.tscn 2>&1 | tee human-warrior-hit-runtime-test.log

      - name: Regression test attack animation runtime
        shell: bash
        run: timeout 360s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" res://tests/__ci_human_warrior_runtime_v02.tscn 2>&1 | tee human-warrior-runtime-v02-regression.log

      - name: Regression test damage and fall reactions
        shell: bash
        run: timeout 360s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" res://tests/__ci_damage_fall_reactions_runtime.tscn 2>&1 | tee damage-fall-regression.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: human-warrior-hit-runtime-v01-diagnostics
          path: |
            human-warrior-hit-runtime-import.log
            human-warrior-hit-runtime-test.log
            human-warrior-runtime-v02-regression.log
            damage-fall-regression.log
          retention-days: 7
