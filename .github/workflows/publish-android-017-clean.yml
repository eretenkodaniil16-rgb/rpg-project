name: Clean Godot 4.7.1 Android validation

on:
  pull_request:
    branches: [feature/ui-v017]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;35.0.1" "platforms;android-35" "cmake;3.10.2.4988404" "ndk;28.1.13356709"
      - name: Install Godot 4.7.1 Standard and templates
        run: |
          curl -L --fail --retry 3 -o godot.zip "https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.1"
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64
          curl -L --fail --retry 3 -o templates.tpz "https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.1.stable" /tmp/templates
          unzip -q templates.tpz -d /tmp/templates
          cp -a /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.1.stable/"
      - name: Clean import
        run: |
          rm -rf .godot
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE" --quit
      - name: Run every GDScript test
        run: |
          for test in tests/*.gd; do
            timeout 90s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --script "res://$test"
          done
      - name: Create debug keystore
        run: |
          keytool -genkeypair -keystore "$GITHUB_WORKSPACE/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=RPG Project,C=NL"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$GITHUB_WORKSPACE/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
      - name: Clean Android debug export
        run: |
          mkdir -p build/android
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --export-debug Android build/android/rpg-project-0.17.0-debug.apk
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose --print-certs build/android/rpg-project-0.17.0-debug.apk
      - name: Upload clean Android APK
        uses: actions/upload-artifact@v4
        with:
          name: rpg-project-0.17.0-android-arm64-debug
          path: build/android/rpg-project-0.17.0-debug.apk
          if-no-files-found: error
          retention-days: 14
