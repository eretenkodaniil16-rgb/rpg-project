name: Living Scroll V3 — Blender smoke render

on:
  push:
    branches:
      - art/living-scroll-v3-blender
    paths:
      - the_living_scroll_v3_blender_project.zip
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: living-scroll-v3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Validate artwork and render 6 preview frames
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Setup Python for layered assets
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify and unpack the project uploaded from the phone
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          root = Path.cwd()
          src = root / 'the_living_scroll_v3_blender_project.zip'
          if not src.exists():
              raise SystemExit('Upload the_living_scroll_v3_blender_project.zip to the root of this branch first.')
          out = root / 'living_scroll_v3'
          out.mkdir(exist_ok=True)
          with ZipFile(src) as z:
              if z.testzip() is not None:
                  raise SystemExit('Archive integrity check failed')
              members = [i for i in z.infolist() if not i.is_dir()]
              if sum(i.file_size for i in members) > 120_000_000:
                  raise SystemExit('Archive too large')
              for i in members:
                  p = Path(i.filename)
                  if p.is_absolute() or '..' in p.parts:
                      raise SystemExit('Unsafe archive path')
              z.extractall(out)
          required = ['blender_scene.py', 'build_layers.py', 'assets/lotus_master.png', 'assets/landscape_master.png']
          for name in required:
              if not (out / name).is_file():
                  raise SystemExit('Archive missing ' + name)
          print('ZIP checked, project ready in', out)
          PY

      - name: Install Pillow and NumPy
        run: python -m pip install --disable-pip-version-check pillow numpy

      - name: Download pinned Blender 5.2.0 LTS and verify SHA256
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libxrender1 libxi6 libxkbcommon0 libsm6 libegl1 libopengl0 libxfixes3
          curl -fL --retry 4 --retry-delay 8 -o blender-5.2.0-linux-x64.tar.xz https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz
          curl -fL --retry 4 -o blender-5.2.0.sha256 https://download.blender.org/release/Blender5.2/blender-5.2.0.sha256
          grep 'blender-5.2.0-linux-x64.tar.xz' blender-5.2.0.sha256 | sha256sum --check --status
          mkdir -p blender-runtime
          tar -xJf blender-5.2.0-linux-x64.tar.xz -C blender-runtime --strip-components=1
          ./blender-runtime/blender --background --factory-startup --python-expr 'import bpy; print("VERIFIED BLENDER:", bpy.app.version_string)'

      - name: Prepare masked artwork layers
        run: python living_scroll_v3/build_layers.py

      - name: Render preview frames and save editable Blender project
        run: |
          ./blender-runtime/blender --background --factory-startup --python living_scroll_v3/blender_scene.py -- --smoke
          test -s living_scroll_v3/living_scroll_v3.blend
          test -s living_scroll_v3/renders/smoke_001.png

      - name: Upload .blend and rendered frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: living-scroll-v3-blender-previews
          path: |
            living_scroll_v3/living_scroll_v3.blend
            living_scroll_v3/renders/smoke_*.png
          if-no-files-found: warn
          retention-days: 7
